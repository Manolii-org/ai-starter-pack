# Example tenant manifest — a FICTIONAL tenant illustrating every schema
# field. Nothing consumes it operationally; it exists only as a shape
# reference for authors writing their own manifest.
version: 0
tenant: exampleco
legal_entity: ExampleCo Pty Ltd
storage:
  r2_bucket: exampleco-backups
  r2_doppler_project: exampleco-knowledge
  pgdump_prefix: pgdump/
systems:
  - name: exampleco-knowledge
    kind: supabase
    doppler_project: exampleco-knowledge
    tier: 0
    rpo_target: 2h
    rto_target: 4h
    exclude_tables: ["public.activity_log", "public.activity_log_*"]
    critical_tables:
      - public.pending_actions
      - public.standing_orders
      - public.audit_log
      - public.project_facts
      - public.notes
    split_exports:
      - name: activity-log
        tables: ["public.activity_log", "public.activity_log_*"]
        cadence: "15 3 * * *"
  - name: exampleco-app
    kind: neon
    doppler_project: exampleco-app
    tier: 0
    rpo_target: 2h
  - name: exampleco-finance
    kind: neon
    doppler_project: exampleco-finance
    tier: 0
    rpo_target: 2h
  - name: exampleco-hobby
    kind: neon
    doppler_project: exampleco-hobby
    tier: 1
    rpo_target: 2h
monitoring:
  sentry_monitor_slugs:
    - backup-nightly
    - backup-pgdump
    - backup-pgdump-critical
    - backup-pgdump-activity-log
    - restore-drill-monthly
  sentry_org_note: "monitor slugs are stable identifiers; never rename"
drill:
  cadence: "0 3 1 * *"
  scope: [supabase-kl, neon-app, activity-log-split, github-metadata]
  receipts_path: reports/drill-receipts/
escrow:
  keys: [BACKUP_ENCRYPTION_KEY, RESTIC_PASSWORD]
  custody_note: "document where recovery keys live for your org"
