# Step-level examples for a product-owned deployment adapter. Pin an immutable
# pack release tag; do not copy these actions through capability sync.
# The caller workflow/job must serialize promotion with one product-specific
# concurrency group and cancel-in-progress: false; the Release pointer has one
# writer at a time.

# Held Vercel promote: run after alias confirmation and after smoke has a final
# outcome. The caller must use `always() && !cancelled()` and defer its job-fail
# guard until after this action completes.
- name: Emit held-alias deployment receipt
  if: ${{ always() && !cancelled() && steps.apex.outcome == 'success' }}
  uses: Manolii-org/ai-starter-pack/.github/actions/emit-deployment-receipt@v1.11.4
  with:
    emit_when: alias-confirmed
    target_sha: ${{ steps.resolve.outputs.sha }}
    canonical_url: https://held.example.com
    live_origin: https://example.com
    previous_deployment_id: ${{ steps.previous.outputs.deployment_id }}
    migration_pending: ${{ steps.migrations.outputs.pending_count }}
    verify_workflow: .github/workflows/smoke-prod.yml
    verify_result: ${{ steps.smoke.outcome }}
    verify_run_url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    gate_run_url: ${{ inputs.gate_run_url }}
    promote_run_url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    repo: ${{ github.repository }}
    rollback_mode: alias-promote

# Fly/image deploy: call only when the real deploy step succeeded. A dry run or
# failed deploy must not mint promotion evidence.
- name: Emit successful image deployment receipt
  if: ${{ always() && !cancelled() && steps.deploy.outcome == 'success' }}
  uses: Manolii-org/ai-starter-pack/.github/actions/emit-deployment-receipt@v1.11.4
  with:
    emit_when: deploy-succeeded
    target_sha: ${{ github.sha }}
    canonical_url: https://service.example.com
    verify_workflow: .github/workflows/deploy.yml
    verify_result: ${{ steps.smoke.outcome }}
    promote_run_url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    repo: ${{ github.repository }}
    rollback_mode: image-revert
