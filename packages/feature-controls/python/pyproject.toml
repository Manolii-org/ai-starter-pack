[build-system]
requires = ["setuptools>=84.1.0,<85"]
build-backend = "setuptools.build_meta"

[project]
name = "manolii-feature-controls"
version = "0.1.0"
description = "Offline provider-backed feature control primitives"
requires-python = ">=3.10"
dependencies = ["growthbook==3.2.0", "jsonschema==4.23.0"]

[tool.setuptools.package-data]
feature_controls = ["schema.json", "py.typed"]
