# AI Starter Pack — Manifest
#
# Controls brand injection and feature flags for rendered output.
# Edit .brand/branded.yml or .brand/unbranded.yml, not this file directly.
# Render (one mode per run — copy a line as-is):
#   copier copy --defaults --data install_mode=branded   . <output-dir>
#   copier copy --defaults --data install_mode=unbranded . <output-dir>
# Enable features by repeating --data, e.g. --data oss_routing=true
# (see copier.yml for the full question/flag set)

version: "1.25.1"   # see CHANGELOG.md

brand:
  ecosystem_name: "{{ECOSYSTEM_NAME}}"
  attribution_line: "{{ATTRIBUTION_LINE}}"
  org_name: "{{ORG_NAME}}"

# Feature flags — set at first-session by Claude Code guided setup,
# or pass as `--data <flag>=true` to copier for pre-rendered artifacts.
features:
  oss_routing: false        # Claude + OSS proxy (Fireworks/Together/Groq). Requires setup-litellm.sh.
  kl_integration: false     # Remote knowledge layer memory backend (kl_* MCP tools).
  browserbase: false        # Browserbase browser automation. Requires BROWSERBASE_API_KEY.
  langfuse_telemetry: false # OTEL tracing to Langfuse. Requires LANGFUSE_PUBLIC_KEY + SECRET.
  codex_adversarial: false  # Cross-provider adversarial PR review. Requires OPENAI_API_KEY.
  mesh_telemetry: false     # Agent-mesh contract telemetry (mesh-contract.yaml.template). Requires MESH_ENABLED wiring.
  codex_review: true        # Codex PR review + security diff scan workflows (Doppler master/prd_codex). Default false under isolation_profile=strict.

isolation_profile: standard # standard | strict — strict: hooks-only settings.json, no maintainer-hosted service coupling

install_mode: unbranded     # branded | unbranded

# Files excluded from output based on feature flags.
# Keys map to feature flag names; values are glob patterns relative to pack root.
feature_excludes:
  # Files excluded when the named feature flag is disabled (false).
  # oss_routing excludes the OSS-tier eligibility matrix (only relevant when OSS
  # routing is enabled). kl_integration (v1.3.0) gates the four Operational
  # Memory skills and the KL-access README stub — dormant without a KL MCP
  # backend + MCP_API_KEY. The eval pack and contract validators do NOT ship
  # to consumer instances; install the manolii-om marketplace plugin.
  # langfuse_telemetry has no file exclusions: scripts/otel-langfuse-headers.sh
  # always ships (dormant without LANGFUSE_* keys); settings.json references it
  # via otelHeadersHelper only when the flag is on.
  oss_routing:
    - docs/us-oss-eligibility-matrix.md
  kl_integration:
    - .claude/skills/om-fact-capture/SKILL.md
    - .claude/skills/om-readiness/SKILL.md
    - .claude/skills/om-staff-answer/SKILL.md
    - .claude/skills/om-handover/SKILL.md
    - docs/knowledge-layer-access.md
  browserbase:
    - .claude/commands/browse.md
    - .claude/commands/nav-record.md
    - .claude/commands/nav-replay.md
  langfuse_telemetry: []
  codex_adversarial:
    - .claude/agents/codex-adversarial.md
  mesh_telemetry:
    - mesh-contract.yaml.template
  codex_review:
    - .github/workflows/codex-pr-review.yml
    - .github/workflows/codex-security-diff-scan.yml
  # Excluded when isolation_profile == 'strict' (a choice, not a bool flag).
  isolation_profile_strict:
    - .github/workflows/setup-env-secret.yml
    - .github/workflows/dependabot-manual-automerge.yml
    - .github/workflows/monitor-litellm.yml
    - .github/workflows/publish-litellm-product-release.yml
    - deploy/litellm-proxy/README.md
    - litellm-product/README.md
    - config/litellm-effective-config.example.yaml
    - config/litellm-product-profile.example.json
    - scripts/setup-litellm.sh
    - scripts/build-litellm-product-asset.py
    - scripts/render-litellm-product-profile.py
    - tests/test_litellm_product_asset.py
    - tests/test_render_litellm_product_profile.py
    - scripts/tests/test_dependabot_manual_automerge.py
    - tests/test_openrouter_retention_policy.py
