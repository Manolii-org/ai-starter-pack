name: E2E Playwright Gate (Reusable)
# Reusable workflow_call form. Caller owns `on:`.
# Cite: .github/workflows/REUSABLE-WORKFLOWS.md
#
# Runs a repo's Playwright suite against the app the suite's own
# `webServer` block starts (or a remote PLAYWRIGHT_BASE_URL), then uploads
# the report, test-results (traces, failure screenshots/videos), and the
# conventional `e2e-artifacts/` journey screenshots — always, pass or fail.
#
# Convention: specs write verification screenshots into `e2e-artifacts/`
# (e.g. `page.screenshot({ path: 'e2e-artifacts/01-login.png' })`) so every
# PR carries visual evidence of the exercised journeys, not just failures.
#
# Caller example:
#
#   e2e:
#     uses: Manolii-org/ai-starter-pack/.github/workflows/e2e-playwright-reusable.yml@<tag-or-sha>
#     with:
#       playwright_args_json: '["--grep", "@smoke"]'
#     secrets:
#       E2E_TEST_USER_EMAIL: ${{ secrets.E2E_TEST_USER_EMAIL }}
#       E2E_TEST_USER_PASSWORD: ${{ secrets.E2E_TEST_USER_PASSWORD }}
#
# Credentials travel via `secrets:` (GitHub forbids the secrets context in
# `with:`); the declared secrets land on the playwright step as TEST_USER_*.
# A missing E2E_TEST_USER_* secret degrades to whatever the suite runs
# unauthenticated (the smoke-tier convention: auth.setup skips when creds
# are absent). `test_env` is for NON-secret env only (PLAYWRIGHT_BASE_URL,
# feature flags) — dotenv-style KEY=VALUE lines merged into the job env.
#
# Security: caller-controlled strings reach the shell as argv words via
# arrays/expansion (never re-parsed as shell source); secrets belong in
# `secrets:` — never in playwright_args_json or test_env.

on:
  workflow_call:
    inputs:
      runs_on:
        type: string
        required: false
        default: 'ubuntu-latest'
        description: Runner label.
      node_version:
        type: string
        required: false
        default: '22'
        description: Node version for setup-node.
      workdir:
        type: string
        required: false
        default: '.'
        description: Working directory containing package.json + playwright.config.
      install_command:
        type: string
        required: false
        default: 'npm ci'
        description: Dependency install shell command (arbitrary shell — keep secrets out).
      build_command:
        type: string
        required: false
        default: ''
        description: Optional pre-test build step (e.g. `npm run build`) run after install.
      browsers:
        type: string
        required: false
        default: 'chromium'
        description: Space-separated playwright browser set for `playwright install`.
      playwright_args_json:
        type: string
        required: false
        default: '[]'
        description: >-
          JSON array of extra argv strings for `playwright test`, e.g.
          '["--grep", "@smoke"]'. An array (not a string) so args containing
          whitespace survive intact.
      test_env:
        type: string
        required: false
        default: ''
        description: >-
          Dotenv-style KEY=VALUE lines injected into the job env before the
          playwright step (NON-secret values only: PLAYWRIGHT_BASE_URL,
          feature flags). Only lines matching an identifier KEY= prefix are
          applied. Credentials go through `secrets:` — the secrets context
          is not allowed inside `with:`.
      artifact_name:
        type: string
        required: false
        default: ''
        description: Artifact name override; defaults to e2e-<caller repo name>.
      artifact_paths:
        type: string
        required: false
        default: "playwright-report/\ntest-results/\ne2e-artifacts/"
        description: >-
          Newline-separated artifact paths, relative to `workdir` (absolute
          paths pass through untouched).
      retention_days:
        type: number
        required: false
        default: 14
        description: Artifact retention.
      timeout_minutes:
        type: number
        required: false
        default: 30
        description: Step-level timeout on the playwright test run.
    secrets:
      E2E_TEST_USER_EMAIL:
        required: false
        description: Synthetic test-account email — lands as TEST_USER_EMAIL.
      E2E_TEST_USER_PASSWORD:
        required: false
        description: Synthetic test-account password — lands as TEST_USER_PASSWORD.

jobs:
  e2e:
    runs-on: ${{ inputs.runs_on }}
    env:
      # pass caller-controlled values through env, not shell source — values
      # are never re-parsed for shell metacharacters
      BROWSERS: ${{ inputs.browsers }}
      PLAYWRIGHT_ARGS_JSON: ${{ inputs.playwright_args_json }}
      TEST_ENV_LINES: ${{ inputs.test_env }}
      ARTIFACT_PATHS_IN: ${{ inputs.artifact_paths }}
      WORKDIR: ${{ inputs.workdir }}
    # job bound covers install (~35m) + the step-level test timeout; keep
    # timeout_minutes under ~50 or raise this ceiling too
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node_version }}

      - name: Install dependencies
        working-directory: ${{ inputs.workdir }}
        timeout-minutes: 20
        run: ${{ inputs.install_command }}

      - name: Build
        if: ${{ inputs.build_command != '' }}
        working-directory: ${{ inputs.workdir }}
        timeout-minutes: 20
        run: ${{ inputs.build_command }}

      - name: Install Playwright browsers
        working-directory: ${{ inputs.workdir }}
        timeout-minutes: 15
        run: npx playwright install --with-deps $BROWSERS

      - name: Apply test env
        if: ${{ inputs.test_env != '' }}
        run: |
          # Only well-formed KEY= lines reach the env — a malformed line can
          # not inject a comment or a second assignment into $GITHUB_ENV.
          echo "$TEST_ENV_LINES" | grep -E '^[A-Za-z_][A-Za-z0-9_]*=' >> "$GITHUB_ENV" || true

      - name: Resolve artifact paths
        id: artifacts
        run: |
          {
            echo 'paths<<EOF'
            echo "$ARTIFACT_PATHS_IN" | while IFS= read -r p; do
              [ -z "$p" ] && continue
              case "$p" in
                /*) echo "$p" ;;
                *) echo "$WORKDIR/$p" ;;
              esac
            done
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Run Playwright suite
        working-directory: ${{ inputs.workdir }}
        timeout-minutes: ${{ inputs.timeout_minutes }}
        env:
          TEST_USER_EMAIL: ${{ secrets.E2E_TEST_USER_EMAIL }}
          TEST_USER_PASSWORD: ${{ secrets.E2E_TEST_USER_PASSWORD }}
        run: |
          python3 -c '
            import json, os, sys
            try:
                args = json.loads(os.environ.get("PLAYWRIGHT_ARGS_JSON") or "[]")
                if not isinstance(args, list) or not all(isinstance(a, str) for a in args):
                    raise ValueError("expected a JSON array of strings")
                if args:
                    print("\n".join(args))
            except Exception as e:
                print(f"::error::playwright_args_json invalid: {e}", file=sys.stderr)
                sys.exit(1)
          ' > /tmp/pw_args.txt
          mapfile -t EXTRA_ARGS < /tmp/pw_args.txt
          npx playwright test "${EXTRA_ARGS[@]}"

      - name: Upload e2e artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact_name != '' && inputs.artifact_name || format('e2e-{0}', github.event.repository.name) }}
          retention-days: ${{ inputs.retention_days }}
          path: ${{ steps.artifacts.outputs.paths }}
