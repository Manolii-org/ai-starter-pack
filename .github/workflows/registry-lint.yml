name: registry-lint

on:
  # Every path — this repo is PUBLIC and PACK-SURFACE scans the whole tree
  # for private slugs/infra ids; a leak in any file must trigger the gate.
  pull_request:
    paths: ['**']
  push:
    branches: [main]
    paths: ['**']

permissions:
  contents: read

jobs:
  registry-gate:
    runs-on: ${{ fromJSON(vars.LIGHT_RUNNER || '["ubuntu-slim"]') }}
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deps
        run: timeout 120 pip install pyyaml copier pytest jsonschema
      - name: Lint the registry
        run: python3 scripts/registry-lint.py
      - name: Freshness — platform plugins are regenerated output
        run: python3 scripts/build-registry.py --check
      - name: Manifest validates + resolver dry-run
        run: |
          python3 - <<'PY'
          import json, yaml, jsonschema, sys
          schema = json.load(open('schemas/ai-manifest.schema.json'))
          doc = yaml.safe_load(open('ai-manifest.yaml'))
          jsonschema.validate(doc, schema)
          print('ai-manifest.yaml valid')
          PY
          mkdir -p /tmp/resolve-check
          python3 scripts/ai-resolve.py --registry . --manifest "$PWD/ai-manifest.yaml" --repo-root /tmp/resolve-check
      - name: Registry unit tests
        run: python3 -m pytest tests/test_registry.py -q
