name: TIA Shadow (Reusable)
# Reusable workflow_call form. Caller owns `on:` (pull_request only — the
# journal diffs HEAD against the PR base SHA).
#
# Observe-only test-impact shadow: never fails, never gates. For each PR it
# computes which test files the diff *should* have run (heuristic map from
# changed sources to test paths) vs which tests *did* run (manifest artifact
# the caller's test job uploads), then writes a JSON journal artifact for
# later enforcement analysis.
#
# Contract with the caller:
#   - The test job uploads a plain-text, one-path-per-line manifest of tests
#     executed as artifact named `tia-ran-tests` containing a file named
#     `ran-tests.txt` (e.g. pytest:
#     `pytest --collect-only -q | sed 's/::.*//' | sort -u`, vitest:
#     `vitest run --reporter=json --outputFile tia-results.json` post-processed
#     to paths, or simply `git ls-files '*_test.go'` when the suite always
#     runs whole). If no such artifact exists the run records
#     `ran_tests: null` and still exits 0.
#   - Optional `.ai/tia-map.json` in the caller repo:
#       {"always_run": ["tests/conftest.py", "e2e/**"],
#        "mappings":   [{"source": "src/api/**", "tests": ["tests/api/**"]}]}
#     Absent -> default heuristic: a changed test/spec file counts itself;
#     a changed `foo.ext` source maps to any `test_foo.*`, `foo.test.*`,
#     `foo.spec.*` found under `test_roots` input (default tests/,e2e/,src/).
#
# Journal artifact `tia-shadow-<head-sha>.json` (retention 30d):
#   {head_sha, base_sha, changed_files, expected_tests, ran_tests|null,
#    missing, unexpected, map_source}
# Missing/unexpected here are observations, not verdicts — collect 2–4
# weeks of journals before proposing any enforcement.

on:
  workflow_call:
    inputs:
      runs_on:
        type: string
        required: false
        default: 'ubuntu-slim'
        description: Runner label — the job is pure git+python, no docker needed.
      test_roots:
        type: string
        required: false
        default: 'tests/,e2e/,src/'
        description: Comma-separated dirs scanned for basename-matched tests when no .ai/tia-map.json exists.
      timeout_minutes:
        type: number
        required: false
        default: 5

permissions:
  contents: read
  actions: read

jobs:
  tia-shadow:
    name: TIA shadow
    runs-on: ${{ inputs.runs_on }}
    timeout-minutes: ${{ inputs.timeout_minutes }}
    # always() — a caller doing `needs: [test-job]` still wants the journal
    # when that test job FAILED (the manifest upload is what makes the
    # failure-vs-coverage gap visible); needs-failure must not skip it.
    if: ${{ always() && github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
          fetch-depth: 0
          # Journal records the PR head — the default merge-ref checkout would
          # give ls-files / tia-map.json of a revision the journal never names.
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Download ran-tests manifest (if any)
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        continue-on-error: true
        id: ran
        with:
          name: tia-ran-tests
          path: ${{ runner.temp }}/tia-ran-tests

      - name: Build TIA journal
        continue-on-error: true
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          TEST_ROOTS: ${{ inputs.test_roots }}
          RAN_DIR: ${{ runner.temp }}/tia-ran-tests
        run: |
          python3 - <<'PY'
          import fnmatch, glob, json, os, subprocess, sys
          from pathlib import Path

          base, head = os.environ["BASE_SHA"], os.environ["HEAD_SHA"]
          changed = [p for p in subprocess.run(
              ["git", "diff", "--name-only", "-z", f"{base}...{head}"],
              capture_output=True, text=True, check=True).stdout.split("\0") if p]
          roots = [r.strip("/") for r in os.environ["TEST_ROOTS"].split(",") if r.strip()]
          # Runnable test patterns only — fixtures/snapshots/data under tests/
          # (test_data.json, *.snap) are NOT executable; counting them in
          # expected_tests fabricates 'missing' journal entries.
          import os.path
          TEST_EXTS = (".py", ".ts", ".tsx", ".js", ".jsx", ".mjs", ".cjs",
                       ".mts", ".cts", ".go", ".cs", ".rs")
          is_test = lambda p: (
              p.endswith(TEST_EXTS) and (
                  os.path.basename(p).startswith("test_") or ".test." in p
                  or ".spec." in p
                  # suffix-form tests (foo_test.go, foo_test.mjs, ...) —
                  # compare the stem so every executable ext is covered
                  or Path(os.path.basename(p)).stem.endswith("_test")))

          map_source = "default-heuristic"
          always, mappings = [], []
          map_file = Path(".ai/tia-map.json")
          if map_file.exists():
              m = json.loads(map_file.read_text())
              always = m.get("always_run", [])
              mappings = m.get("mappings", [])
              map_source = ".ai/tia-map.json"

          all_files = [p for p in subprocess.run(
              ["git", "ls-files", "-z"], capture_output=True, text=True,
              check=True).stdout.split("\0") if p]
          # Intersect with ls-files: a deleted test can't run, so counting it
          # as expected would fabricate a 'missing' entry in the journal.
          expected = set(p for p in changed if is_test(p) and p in set(all_files))
          if mappings or always:
              expected.update(t for t in all_files
                              if any(fnmatch.fnmatch(t, g) for g in always))
              for c in changed:
                  for mp in mappings:
                      if fnmatch.fnmatch(c, mp["source"]):
                          expected.update(t for t in all_files
                                          if any(fnmatch.fnmatch(t, g) for g in mp["tests"]))
          else:
              # basename heuristic: foo.py -> test_foo.* / foo.test.* / foo.spec.*
              for c in changed:
                  if is_test(c) or c.startswith(("docs/", ".github/")):
                      continue
                  stem = Path(c).stem
                  # Escape metachars — a stem like '[id]' is a char class to
                  # fnmatch; match it literally.
                  stem = glob.escape(stem)
                  patterns = (f"test_{stem}.*", f"{stem}.test.*", f"{stem}.spec.*", f"{stem}_test.*")
                  expected.update(t for t in all_files
                                  if t != c
                                  # full-path-prefix match — nested roots like
                                  # packages/api/tests/ must not collapse to
                                  # the first component ('packages')
                                  and any(t == r or t.startswith(r + "/") for r in roots)
                                  and is_test(t)
                                  and any(fnmatch.fnmatch(Path(t).name, pat) for pat in patterns))

          ran = None
          # The artifact extracts under RAN_DIR — read whatever manifest
          # file(s) the caller put there; never search the repo.
          ran_dir = Path(os.environ["RAN_DIR"])
          ran_files = sorted(p for p in ran_dir.rglob("*") if p.is_file()) if ran_dir.is_dir() else []
          if ran_files:
              ran = sorted({l.strip() for f in ran_files
                            for l in f.read_text().splitlines() if l.strip()})
          journal = {
              "head_sha": head, "base_sha": base,
              "changed_files": changed,
              "expected_tests": sorted(expected),
              "ran_tests": ran,
              "missing": sorted(expected - set(ran)) if ran is not None else None,
              "unexpected": sorted(set(ran) - expected) if ran is not None else None,
              "map_source": map_source,
          }
          # RUNNER_TEMP, not the checkout — writing into the workspace would
          # let a PR-controlled tia-shadow.json masquerade as the journal if
          # this script ever fails between write and upload.
          Path(os.environ["RUNNER_TEMP"], "tia-shadow.json").write_text(json.dumps(journal, indent=2))
          print(f"tia-shadow: {len(changed)} changed, {len(expected)} expected, "
                f"ran={'unknown (no tia-ran-tests artifact)' if ran is None else len(ran)}, "
                f"missing={None if ran is None else len(journal['missing'])}")
          PY

      - name: Upload journal
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tia-shadow-${{ github.event.pull_request.head.sha }}-a${{ github.run_attempt }}
          path: ${{ runner.temp }}/tia-shadow.json
          retention-days: 30
          if-no-files-found: warn
