        persist-credentials: false
        fetch-depth: 0
        token: ${{ github.token }}
        ref: ${{ steps.ref.outputs.head_sha }}
    - name: Determine skip conditions
      id: pr
      if: steps.ref.outputs.skip != 'true' && steps.custody.outputs.skip == 'false'
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        EVENT_NAME: ${{ github.event_name }}
        COMMENT_BODY: ${{ github.event.comment.body || github.event.review.body || '' }}
        PR_NUM: ${{ steps.ref.outputs.pr_number }}
        ACTOR: ${{ github.actor }}
        WR_ACTOR: ${{ github.event.workflow_run.actor.login || '' }}
        TRUSTED_BOTS: ${{ inputs.trusted_agent_bots }}
        WR_NAME: ${{ github.event.workflow_run.name || '' }}
        WR_URL: ${{ github.event.workflow_run.html_url || '' }}
        REVIEW_STATE: ${{ github.event.review.state }}
        REPOSITORY: ${{ github.repository }}
      run: "set -euo pipefail\necho \"number=$PR_NUM\" >> \"$GITHUB_OUTPUT\"\necho \"trigger_workflow=$WR_NAME\" >> \"$GITHUB_OUTPUT\"\necho \"\
        trigger_run_url=$WR_URL\" >> \"$GITHUB_OUTPUT\"\n\n# Loop break: prior autofix commit still HEAD\nLAST_MSG=$(git log -1 --pretty=%s 2>/dev/null\
        \ || echo '')\nif [[ \"$LAST_MSG\" == \\[autofix\\]* ]]; then\n  echo \"skip=true\" >> \"$GITHUB_OUTPUT\"\n  echo \"Latest commit is [autofix];\
        \ skipping to avoid loop\"\n  exit 0\nfi\n\nif echo \"$COMMENT_BODY\" | grep -qi \"skip-autofix\"; then\n  echo \"skip=true\" >> \"$GITHUB_OUTPUT\"\
        \n  exit 0\nfi\n\n# Human issue_comment needs @claude; relayed **[@ and workflow_run do not\nif [[ \"$EVENT_NAME\" == \"issue_comment\"\
        \ ]]; then\n  if [[ \"$ACTOR\" == \"github-actions[bot]\" ]] && [[ \"$COMMENT_BODY\" == '**[@'* ]]; then\n    : # relayed bot review \u2014\
        \ proceed\n  elif ! echo \"$COMMENT_BODY\" | grep -qi \"@claude\"; then\n    echo \"skip=true\" >> \"$GITHUB_OUTPUT\"\n    exit 0\n  fi\n\
        fi\n\nif [[ \"$EVENT_NAME\" == \"pull_request_review\" ]]; then\n  if [[ \"$REVIEW_STATE\" == \"approved\" ]] && [[ -z \"$COMMENT_BODY\"\
        \ || \"$COMMENT_BODY\" == \"null\" ]]; then\n    echo \"skip=true\" >> \"$GITHUB_OUTPUT\"\n    exit 0\n  fi\nfi\n\n# Opt-in trusted agent\
        \ bots (e.g. Devin, Codex cloud, Cursor\n# background agents) whose pushes may trigger Autofix when CI fails.\n# Only on the workflow_run\
        \ path, only for [bot] actors, matched like\n# the action's allowed_bots (case-insensitive, [bot] optional); '*'\n# is never honoured.\
        \ Fork heads were already refused above.\n# The action's allowed_bots receives only this sanitised list, so a\n# '*' or malformed entry\
        \ can never widen it either.\ntrusted_bots() {\n  local entry\n  IFS=',' read -ra entries <<< \"${TRUSTED_BOTS:-}\"\n  for entry in \"\
        ${entries[@]}\"; do\n    entry=\"${entry#\"${entry%%[![:space:]]*}\"}\"\n    entry=\"${entry%\"${entry##*[![:space:]]}\"}\"\n    entry=\"\
        ${entry,,}\"\n    entry=\"${entry%\\[bot\\]}\"\n    if [[ \"$entry\" =~ ^[a-z0-9][a-z0-9-]*$ ]]; then echo \"$entry\"; fi\n  done\n}\n\
        trusted_bot() {\n  local who=\"${1,,}\" entry\n  who=\"${who%\\[bot\\]}\"\n  for entry in $(trusted_bots); do\n    [[ \"$entry\" == \"\
        $who\" ]] && return 0\n  done\n  return 1\n}\n# Agent bots reach the action only on the CI-failure path; comment\n# and review triggers\
        \ keep the relay bot alone.\nallowed_bots=\"github-actions\"\nif [[ \"$EVENT_NAME\" == \"workflow_run\" ]]; then\n  for entry in $(trusted_bots);\
        \ do allowed_bots+=\",$entry\"; done\nfi\necho \"allowed_bots=$allowed_bots\" >> \"$GITHUB_OUTPUT\"\n\n# claude-code-action fails the\
        \ job (rather than skipping) for bot\n# actors outside allowed_bots and for actors without write access.\n# Only the relay bot and opted-in\
        \ agent bots are allowed; skip\n# everything else before dispatch.\nfor who in \"$ACTOR\" \"${WR_ACTOR:-}\"; do\n  [[ -z \"$who\" ]] &&\
        \ continue\n  if [[ \"$who\" == \"github-actions[bot]\" && \"$EVENT_NAME\" == \"issue_comment\" && \"$COMMENT_BODY\" == '**[@'* ]]; then\n\
        \    continue\n  fi\n  if [[ \"$EVENT_NAME\" == \"workflow_run\" && \"$who\" == *\"[bot]\" ]] && trusted_bot \"$who\"; then\n    continue\n\
        \  fi\n  PERM=$(timeout -k 5 30 gh api \"repos/${REPOSITORY}/collaborators/${who}/permission\" --jq '.permission' 2>/dev/null || echo\
        \ unknown)\n  case \"$PERM\" in\n    admin|write) ;;\n    *)\n      echo \"skip=true\" >> \"$GITHUB_OUTPUT\"\n      echo \"Actor ${who}\
        \ has no write access or is a non-relay bot (permission=${PERM}); skipping\"\n      exit 0\n      ;;\n  esac\ndone\n\n# Fail closed on\
        \ opt-out labels: a failed lookup must not silently\n# bypass a PR's skip-ai-review label.\nif ! LABELS=$(timeout -k 5 30 gh pr view \"\
        $PR_NUM\" --repo \"${REPOSITORY}\" --json labels --jq '[.labels[].name]' 2>/dev/null); then\n  echo \"skip=true\" >> \"$GITHUB_OUTPUT\"\
        \n  echo \"label lookup failed \u2014 opt-out labels unverifiable; skipping\"\n  exit 0\nfi\nif echo \"$LABELS\" | grep -q \"skip-ai-review\"\
        ; then\n  echo \"skip=true\" >> \"$GITHUB_OUTPUT\"\nelse\n  echo \"skip=false\" >> \"$GITHUB_OUTPUT\"\nfi\n"
    - name: Enforce per-PR successful-fix budget
      id: budget
      if: steps.ref.outputs.skip != 'true' && steps.custody.outputs.skip == 'false' && steps.pr.outputs.skip != 'true'
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        PR_NUM: ${{ steps.pr.outputs.number }}
        MAX_FIXES: ${{ inputs.max_successful_fixes }}
        REPOSITORY: ${{ github.repository }}
      run: "set -euo pipefail\nMAX_FIXES=\"${MAX_FIXES:-1}\"\nif [[ ! \"$MAX_FIXES\" =~ ^[0-9]+$ ]]; then echo \"skip=true\" >> \"$GITHUB_OUTPUT\"\
        ; exit 0; fi\n# Count commits on this PR whose subject starts with [autofix].\n# --paginate runs the jq per page, so awk sums across pages.\
        \ Fail\n# closed: a timed-out/failed enumeration must not read as 0, which\n# would let an exhausted budget dispatch another agent pass.\n\
        if ! COUNT=$(timeout -k 5 30 gh api \"repos/${REPOSITORY}/pulls/${PR_NUM}/commits\" --paginate \\\n  --jq '[.[].commit.message | split(\"\
        \\n\")[0] | select(startswith(\"[autofix]\"))] | length' 2>/dev/null \\\n  | awk '{s+=$1} END {print s+0}'); then\n  echo \"skip=true\"\
        \ >> \"$GITHUB_OUTPUT\"\n  echo \"::notice::Commit enumeration failed/timed out \u2014 budget unverifiable; skipping\"\n  exit 0\nfi\n\
        echo \"successful_fix_commits=$COUNT\" >> \"$GITHUB_OUTPUT\"\nif [[ \"$COUNT\" -ge \"$MAX_FIXES\" ]]; then\n  echo \"skip=true\" >> \"\
        $GITHUB_OUTPUT\"\n  echo \"::notice::Per-PR autofix budget reached ($COUNT >= $MAX_FIXES successful [autofix] commits); skipping\"\n \
        \ # autofix-control:budget-notice:begin\n  #!/usr/bin/env bash\n  # One material budget receipt; repeated exhausted-budget wakes stay\
        \ quiet.\n  notice=unknown\n  for page in 1 2 3 4 5; do\n    if ! comments=$(timeout -k 5 30 gh api \"repos/${REPOSITORY}/issues/${PR_NUM}/comments?per_page=100&page=${page}\"\
        \ 2>/dev/null); then break; fi\n    if ! jq -e 'type == \"array\"' <<< \"$comments\" >/dev/null; then break; fi\n    if jq -e 'any(.[];\
        \ .user.id == 41898282 and ((.body // \"\") | startswith(\"<!-- pack-autofix:budget-exhausted -->\")))' <<< \"$comments\" >/dev/null;\
        \ then\n      notice=seen; break\n    fi\n    if [[ $(jq 'length' <<< \"$comments\") -lt 100 ]]; then notice=absent; break; fi\n  done\n\
        \  if [[ \"$notice\" == absent ]]; then\n    timeout -k 5 30 gh pr comment \"$PR_NUM\" --repo \"$REPOSITORY\" --body \"<!-- pack-autofix:budget-exhausted\
        \ --> Autofix reached its configured successful-fix budget (${COUNT}/${MAX_FIXES}). The original owner retains unfinished commitments.\
        \ Do not remove commits, reset counters or switch owners to evade this budget.\" || true\n  fi\n  # autofix-control:budget-notice:end\n\
        else\n  echo \"skip=false\" >> \"$GITHUB_OUTPUT\"\nfi\n"
    - name: Attach PR branch at validated SHA
      if: steps.ref.outputs.skip != 'true' && steps.custody.outputs.skip == 'false' && steps.pr.outputs.skip != 'true' && steps.budget.outputs.skip
        != 'true'
      env:
        HEAD_REF: ${{ steps.ref.outputs.head_ref }}
      run: |
        # Defense in depth: reject names git itself would not check out.
        git check-ref-format --branch "$HEAD_REF"
        git checkout -B "$HEAD_REF"
    - name: Restore trusted instruction surface from PR base
      if: steps.ref.outputs.skip != 'true' && steps.custody.outputs.skip == 'false' && steps.pr.outputs.skip != 'true' && steps.budget.outputs.skip
        != 'true'
      env:
        GH_TOKEN: ${{ github.token }}
        REPOSITORY: ${{ github.repository }}
        PR_NUMBER: ${{ steps.ref.outputs.pr_number }}
      run: |
        set -euo pipefail
        # Body is byte-identical in pr-autofix-loop.yml and pr-autofix-loop-reusable.yml
        # (tests/test_autofix_hardening.py). It is inlined rather than a script in the
        # checkout because the checkout is the PR head and therefore PR-controlled.
        export GIT_LITERAL_PATHSPECS=1
        if ! BASE_SHA=$(timeout -k 5 30 gh api "repos/${REPOSITORY}/pulls/${PR_NUMBER}" --jq '.base.sha') ||
           ! printf '%s' "$BASE_SHA" | grep -qxE '[0-9a-f]{40}'; then
          echo "::error::Could not resolve the PR base SHA; refusing to run the agent on an unrestored instruction surface"
          exit 1
        fi
        if ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
