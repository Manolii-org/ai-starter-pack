          # images happen to ship PyYAML, which has kept this an undeclared
          # dependency; slim and self-hosted runners do not.
          if ! python3 -c "import yaml" 2>/dev/null; then
            python3 -m pip install --quiet --disable-pip-version-check pyyaml
          fi

      - name: Check out pack for hydration
        if: steps.hydrate_probe.outputs.needed == 'true'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          repository: Manolii-org/ai-starter-pack
          ref: ${{ inputs.pack_ref }}
          path: .pack-hydrate
          persist-credentials: false
          # Only the two trees ASSESSMENT_RUNTIME_FILES can name — the rest of
          # the pack (kernel, docs, prompts, telemetry) is dead weight here.
          sparse-checkout: |
            scripts
            .claude

      - name: Hydrate assessment runtime
        if: steps.hydrate_probe.outputs.needed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          for f in $ASSESSMENT_RUNTIME_FILES; do
            [[ -e "$f" ]] && continue
            if [[ ! -e ".pack-hydrate/$f" ]]; then
              # A listed path the pack no longer ships means this list and the
              # runners have drifted. Continuing would resurface later as an
              # opaque FileNotFoundError inside a runner.
              echo "::error::$f is not present in the pack at '${{ inputs.pack_ref }}'"
              exit 1
            fi
            mkdir -p "$(dirname "$f")"
            cp ".pack-hydrate/$f" "$f"
            echo "hydrated $f"
          done
          chmod +x scripts/run-*.py 2>/dev/null || true
          # Scratch tree: leaving a second full copy of the pack in the
          # workspace would be walked by later steps (skill discovery,
          # artifact globs) and by the caller's own tooling.
          rm -rf .pack-hydrate

      - name: Download all candidates
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: '*-candidates'
          path: .ai/candidates/
          merge-multiple: true

      - name: Run judge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          mkdir -p .ai/judge-log
          python3 scripts/run-judge.py \
            --candidates-dir .ai/candidates/ \
            --pr-number "$PR_NUMBER" \
            --repo "$REPO"
