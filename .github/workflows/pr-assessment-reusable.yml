name: PR Assessment (Reusable)
# Reusable workflow_call form of pr-assessment.yml.
# Caller owns the `on:` triggers; this file only defines the jobs.
# Skip drafts on pull_request (keep workflow_dispatch). Callers must still
# list ready_for_review or marking a draft ready never starts assessment.
# Downstream jobs require needs.classify.result == 'success' so SAST cannot
# start when classify is skipped (empty depth is not the string 'none').
# Dual provider_mode: anthropic (direct ANTHROPIC_API_KEY) | proxy (LiteLLM via ANTHROPIC_BASE_URL + LITELLM_MASTER_KEY).
# See REUSABLE-WORKFLOWS.md for caller examples and secret passing conventions.
# config-completeness-ignore: uses
# config-completeness-ignore: with
# config-completeness-ignore: id
# config-completeness-ignore: name
# config-completeness-ignore: run

on:
  workflow_call:
    inputs:
      provider_mode: { type: string, default: anthropic, description: 'anthropic (direct ANTHROPIC_API_KEY) | proxy (LiteLLM via ANTHROPIC_BASE_URL + LITELLM_MASTER_KEY).' }
      litellm_proxy_url: { type: string, default: '', description: 'Proxy base URL for proxy mode; pass vars.LITELLM_PROXY_URL.' }
      model: { type: string, default: '', description: 'Optional model id override; empty = script/action default.' }
      runs_on: { type: string, default: ubuntu-latest }
      pack_ref: { type: string, default: v1, description: 'Ref of Manolii-org/ai-starter-pack to hydrate missing runtime files from. Defaults to the moving major alias; callers on an immutable reusable pin should pass the same tag. Fetched only when the caller is missing at least one file.' }
      trusted_sync_author_id: { type: number, default: 215220684, description: 'GitHub numeric user id allowed to skip assessment on automated/sync-* PRs (mechanical sync bot). Set 0 to disable the skip entirely.' }
    secrets:
      ANTHROPIC_API_KEY: { required: false, description: 'Required when provider_mode=anthropic.' }
      LITELLM_MASTER_KEY: { required: false, description: 'Required when provider_mode=proxy.' }


permissions:
  contents: read
  pull-requests: write

# Runtime surface the runner scripts read from disk. Consumers that vendor
# their own copies keep them; anything absent is hydrated from the pack at
# `pack_ref` so adopting the pipeline is a one-file change in the consumer.
# Keep in lockstep with the runners' hard-coded paths — run-pr-classifier.py
# reads .claude/agents/pr-classifier.md, run-broad-agents.py reads the three
# broad agents, run-specialists.py reads one SKILL.md per name in
# run-pr-classifier.py's _VALID_SKILLS, and run-judge.py needs no prompt file
# (its system prompt is inline). tests/test_hydrate_assessment.py fails if
# this list and the runners drift apart.
env:
  ASSESSMENT_RUNTIME_FILES: >-
    scripts/run-pr-classifier.py
    scripts/run-specialists.py
    scripts/run-broad-agents.py
    scripts/run-judge.py
    .claude/agents/pr-classifier.md
    .claude/agents/systems-consistency.md
    .claude/agents/architecture-impact.md
    .claude/agents/security-deep-dive.md
    .claude/skills/shell-security/SKILL.md
    .claude/skills/config-completeness/SKILL.md
    .claude/skills/migration-safety/SKILL.md
    .claude/skills/docs-fact-check/SKILL.md
    .claude/skills/test-adequacy/SKILL.md
    .claude/skills/security-boundary-test/SKILL.md
    .claude/skills/scope-adherence/SKILL.md

jobs:
  classify:
    name: Classify PR
    runs-on: ${{ inputs.runs_on }}
    # Skip mechanical sync PRs by HEAD BRANCH, not just title — the sync
    # tooling titles PRs "chore: sync …" (no parenthesis), so the title-only
    # guard never matched and the full pipeline ran on every sync PR.
    # Gated on same-repo head AND the trusted sync author id so an arbitrary
    # write-access user naming a branch automated/sync-* cannot dodge
    # assessment; merge authorization additionally stays with the auto-merge
    # gate's structural verifier.
    if: |
      (github.event_name != 'pull_request' || github.event.pull_request.draft != true) &&
      !contains(github.event.pull_request.labels.*.name, 'skip-ai-review') &&
      !startsWith(github.event.pull_request.title, 'chore(sync):') &&
      !(startsWith(github.head_ref, 'automated/sync-') && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.id == inputs.trusted_sync_author_id)
    outputs:
      invoke_skills: ${{ steps.classify.outputs.invoke_skills }}
      invoke_agents: ${{ steps.classify.outputs.invoke_agents }}
      depth: ${{ steps.classify.outputs.depth }}
    # Provider env — all steps inherit; empty ANTHROPIC_BASE_URL is a no-op for anthropic mode.
    env:
      ANTHROPIC_API_KEY: ${{ inputs.provider_mode == 'proxy' && secrets.LITELLM_MASTER_KEY || secrets.ANTHROPIC_API_KEY }}
      ANTHROPIC_BASE_URL: ${{ inputs.provider_mode == 'proxy' && inputs.litellm_proxy_url || '' }}
      ANTHROPIC_MODEL: ${{ inputs.model }}
    steps:
      - name: Validate provider secrets
        env:
          PM: ${{ inputs.provider_mode }}
          AK: ${{ secrets.ANTHROPIC_API_KEY }}
          LK: ${{ secrets.LITELLM_MASTER_KEY }}
          PURL: ${{ inputs.litellm_proxy_url }}
        run: |
          if [[ "$PM" == "proxy" ]]; then
            if [[ -z "$LK" ]]; then echo "::error::provider_mode=proxy requires LITELLM_MASTER_KEY"; exit 1; fi
            if [[ -z "$PURL" ]]; then echo "::error::provider_mode=proxy requires litellm_proxy_url"; exit 1; fi
          else
            if [[ -z "$AK" ]]; then echo "::error::provider_mode=anthropic requires ANTHROPIC_API_KEY"; exit 1; fi
          fi

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
          fetch-depth: 0

      # ── Assessment runtime hydration ────────────────────────────────────
      # The probe runs first and fetches NOTHING when the caller already ships
      # every runtime file. That keeps an unreachable or mistyped `pack_ref`
      # from being able to break a repo that does not need hydration at all.
      - name: Probe assessment runtime
        id: hydrate_probe
        shell: bash
        run: |
          set -euo pipefail
          missing=""
          for f in $ASSESSMENT_RUNTIME_FILES; do
            [[ -e "$f" ]] || missing="$missing $f"
          done
          if [[ -n "$missing" ]]; then
            echo "needed=true" >> "$GITHUB_OUTPUT"
            echo "Hydration required for:$missing"
          else
            echo "needed=false" >> "$GITHUB_OUTPUT"
            echo "Caller ships the full assessment runtime — no hydration."
          fi
          # The runners import yaml to parse agent/skill frontmatter. Hosted
          # images happen to ship PyYAML, which has kept this an undeclared
          # dependency; slim and self-hosted runners do not.
          if ! python3 -c "import yaml" 2>/dev/null; then
            python3 -m pip install --quiet --disable-pip-version-check pyyaml
          fi

      - name: Check out pack for hydration
        if: steps.hydrate_probe.outputs.needed == 'true'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          repository: Manolii-org/ai-starter-pack
          ref: ${{ inputs.pack_ref }}
          path: .pack-hydrate
          persist-credentials: false
          # Only the two trees ASSESSMENT_RUNTIME_FILES can name — the rest of
          # the pack (kernel, docs, prompts, telemetry) is dead weight here.
          sparse-checkout: |
            scripts
            .claude

      - name: Hydrate assessment runtime
        if: steps.hydrate_probe.outputs.needed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          for f in $ASSESSMENT_RUNTIME_FILES; do
            [[ -e "$f" ]] && continue
            if [[ ! -e ".pack-hydrate/$f" ]]; then
              # A listed path the pack no longer ships means this list and the
              # runners have drifted. Continuing would resurface later as an
              # opaque FileNotFoundError inside a runner.
              echo "::error::$f is not present in the pack at '${{ inputs.pack_ref }}'"
              exit 1
            fi
            mkdir -p "$(dirname "$f")"
            cp ".pack-hydrate/$f" "$f"
            echo "hydrated $f"
          done
          chmod +x scripts/run-*.py 2>/dev/null || true
          # Scratch tree: leaving a second full copy of the pack in the
          # workspace would be walked by later steps (skill discovery,
          # artifact globs) and by the caller's own tooling.
          rm -rf .pack-hydrate

      - name: Get PR diff
        id: diff
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git diff "origin/${BASE_REF}...HEAD" > /tmp/pr.diff
          echo "lines=$(wc -l < /tmp/pr.diff)" >> $GITHUB_OUTPUT
          echo "files=$(git diff --name-only "origin/${BASE_REF}...HEAD" | wc -l)" >> $GITHUB_OUTPUT

      - name: Run pr-classifier
        id: classify
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          mkdir -p .ai/candidates
          # Run pr-classifier agent via Claude API
          python3 scripts/run-pr-classifier.py \
            --diff /tmp/pr.diff \
            --title "$PR_TITLE" \
            --body "$PR_BODY" \
            --output /tmp/classifier-output.json

          # Parse output for downstream jobs
          SKILLS=$(python3 -c "import json; d=json.load(open('/tmp/classifier-output.json')); print(','.join(d.get('invoke_skills',[])))")
          AGENTS=$(python3 -c "import json; d=json.load(open('/tmp/classifier-output.json')); print(','.join(d.get('invoke_agents',[])))")
          DEPTH=$(python3 -c "import json; d=json.load(open('/tmp/classifier-output.json')); print(d.get('depth','none'))")

          echo "invoke_skills=$SKILLS" >> $GITHUB_OUTPUT
          echo "invoke_agents=$AGENTS" >> $GITHUB_OUTPUT
          echo "depth=$DEPTH" >> $GITHUB_OUTPUT
          echo "Classification: depth=$DEPTH skills=$SKILLS agents=$AGENTS"

  sast:
    name: SAST (Semgrep + Bandit)
    runs-on: ${{ inputs.runs_on }}
    needs: [classify]
    if: needs.classify.result == 'success' && needs.classify.outputs.depth != 'none'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0

      - name: Run Semgrep
        uses: returntocorp/semgrep-action@713efdd345f3035192eaa63f56867b88e63e4e5d # v1
        continue-on-error: true
        with:
          config: auto
          output: /tmp/semgrep-results.json
          json: true

      - name: Run Bandit (Python)
        if: hashFiles('**/*.py') != ''
        run: |
          pip install bandit -q
          bandit -r . -f json -o /tmp/bandit-results.json --exclude ./.venv,./node_modules || true

      - name: Merge SAST findings
        run: |
          mkdir -p .ai
          python3 -c "
          import json, os
          findings = []
          for path in ['/tmp/semgrep-results.json', '/tmp/bandit-results.json']:
              if os.path.exists(path):
                  try:
                      data = json.load(open(path))
                      # Normalise to common schema
                      if 'results' in data and data['results'] and 'check_id' in data['results'][0]:  # semgrep
                          for r in data['results']:
                              findings.append({'finding_id': f'semgrep-{r[\"check_id\"]}-{r[\"path\"]}', 'rule': r['check_id'], 'file': r['path'], 'line': r['start']['line'], 'message': r['extra']['message'], 'severity': r['extra']['severity'].upper()})
                      elif 'results' in data:  # bandit
                          for r in data.get('results', []):
                              findings.append({'finding_id': f'bandit-{r[\"test_id\"]}-{r[\"filename\"]}', 'rule': r['test_id'], 'file': r['filename'], 'line': r['line_number'], 'message': r['issue_text'], 'severity': r['issue_severity'].upper()})
                  except Exception as e:
                      print(f'Warning: could not parse {path}: {e}')
          json.dump(findings, open('.ai/sast-findings.json', 'w'), indent=2)
          print(f'Merged {len(findings)} SAST findings')
          "

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sast-findings
          path: .ai/sast-findings.json

  specialists:
    name: Specialist Skills
    runs-on: ${{ inputs.runs_on }}
    needs: [classify, sast]
    if: needs.classify.result == 'success' && needs.classify.outputs.invoke_skills != ''
    # Provider env — all steps inherit; empty ANTHROPIC_BASE_URL is a no-op for anthropic mode.
    env:
      ANTHROPIC_API_KEY: ${{ inputs.provider_mode == 'proxy' && secrets.LITELLM_MASTER_KEY || secrets.ANTHROPIC_API_KEY }}
      ANTHROPIC_BASE_URL: ${{ inputs.provider_mode == 'proxy' && inputs.litellm_proxy_url || '' }}
      ANTHROPIC_MODEL: ${{ inputs.model }}
    steps:
      - name: Validate provider secrets
        env:
          PM: ${{ inputs.provider_mode }}
          AK: ${{ secrets.ANTHROPIC_API_KEY }}
          LK: ${{ secrets.LITELLM_MASTER_KEY }}
          PURL: ${{ inputs.litellm_proxy_url }}
        run: |
          if [[ "$PM" == "proxy" ]]; then
            if [[ -z "$LK" ]]; then echo "::error::provider_mode=proxy requires LITELLM_MASTER_KEY"; exit 1; fi
            if [[ -z "$PURL" ]]; then echo "::error::provider_mode=proxy requires litellm_proxy_url"; exit 1; fi
          else
            if [[ -z "$AK" ]]; then echo "::error::provider_mode=anthropic requires ANTHROPIC_API_KEY"; exit 1; fi
          fi

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0

      # ── Assessment runtime hydration ────────────────────────────────────
      # The probe runs first and fetches NOTHING when the caller already ships
      # every runtime file. That keeps an unreachable or mistyped `pack_ref`
      # from being able to break a repo that does not need hydration at all.
      - name: Probe assessment runtime
        id: hydrate_probe
        shell: bash
        run: |
          set -euo pipefail
          missing=""
          for f in $ASSESSMENT_RUNTIME_FILES; do
            [[ -e "$f" ]] || missing="$missing $f"
          done
          if [[ -n "$missing" ]]; then
            echo "needed=true" >> "$GITHUB_OUTPUT"
            echo "Hydration required for:$missing"
          else
            echo "needed=false" >> "$GITHUB_OUTPUT"
            echo "Caller ships the full assessment runtime — no hydration."
          fi
          # The runners import yaml to parse agent/skill frontmatter. Hosted
          # images happen to ship PyYAML, which has kept this an undeclared
          # dependency; slim and self-hosted runners do not.
          if ! python3 -c "import yaml" 2>/dev/null; then
            python3 -m pip install --quiet --disable-pip-version-check pyyaml
          fi

      - name: Check out pack for hydration
        if: steps.hydrate_probe.outputs.needed == 'true'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          repository: Manolii-org/ai-starter-pack
          ref: ${{ inputs.pack_ref }}
          path: .pack-hydrate
          persist-credentials: false
          # Only the two trees ASSESSMENT_RUNTIME_FILES can name — the rest of
          # the pack (kernel, docs, prompts, telemetry) is dead weight here.
          sparse-checkout: |
            scripts
            .claude

      - name: Hydrate assessment runtime
        if: steps.hydrate_probe.outputs.needed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          for f in $ASSESSMENT_RUNTIME_FILES; do
            [[ -e "$f" ]] && continue
            if [[ ! -e ".pack-hydrate/$f" ]]; then
              # A listed path the pack no longer ships means this list and the
              # runners have drifted. Continuing would resurface later as an
              # opaque FileNotFoundError inside a runner.
              echo "::error::$f is not present in the pack at '${{ inputs.pack_ref }}'"
              exit 1
            fi
            mkdir -p "$(dirname "$f")"
            cp ".pack-hydrate/$f" "$f"
            echo "hydrated $f"
          done
          chmod +x scripts/run-*.py 2>/dev/null || true
          # Scratch tree: leaving a second full copy of the pack in the
          # workspace would be walked by later steps (skill discovery,
          # artifact globs) and by the caller's own tooling.
          rm -rf .pack-hydrate

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: sast-findings
          path: .ai/

      - name: Run specialist skills
        env:
          SKILLS: ${{ needs.classify.outputs.invoke_skills }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          mkdir -p .ai/candidates
          git diff "origin/${BASE_REF}...HEAD" > /tmp/pr.diff
          python3 scripts/run-specialists.py \
            --skills "$SKILLS" \
            --diff /tmp/pr.diff \
            --candidates-dir .ai/candidates/

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: specialist-candidates
          path: .ai/candidates/

  broad-agents:
    name: Broad Agents
    runs-on: ${{ inputs.runs_on }}
    needs: [classify, sast]
    if: needs.classify.result == 'success' && needs.classify.outputs.depth == 'broad'
    # Provider env — all steps inherit; empty ANTHROPIC_BASE_URL is a no-op for anthropic mode.
    env:
      ANTHROPIC_API_KEY: ${{ inputs.provider_mode == 'proxy' && secrets.LITELLM_MASTER_KEY || secrets.ANTHROPIC_API_KEY }}
      ANTHROPIC_BASE_URL: ${{ inputs.provider_mode == 'proxy' && inputs.litellm_proxy_url || '' }}
      ANTHROPIC_MODEL: ${{ inputs.model }}
    steps:
      - name: Validate provider secrets
        env:
          PM: ${{ inputs.provider_mode }}
          AK: ${{ secrets.ANTHROPIC_API_KEY }}
          LK: ${{ secrets.LITELLM_MASTER_KEY }}
          PURL: ${{ inputs.litellm_proxy_url }}
        run: |
          if [[ "$PM" == "proxy" ]]; then
            if [[ -z "$LK" ]]; then echo "::error::provider_mode=proxy requires LITELLM_MASTER_KEY"; exit 1; fi
            if [[ -z "$PURL" ]]; then echo "::error::provider_mode=proxy requires litellm_proxy_url"; exit 1; fi
          else
            if [[ -z "$AK" ]]; then echo "::error::provider_mode=anthropic requires ANTHROPIC_API_KEY"; exit 1; fi
          fi

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
          fetch-depth: 0

      # ── Assessment runtime hydration ────────────────────────────────────
      # The probe runs first and fetches NOTHING when the caller already ships
      # every runtime file. That keeps an unreachable or mistyped `pack_ref`
      # from being able to break a repo that does not need hydration at all.
      - name: Probe assessment runtime
        id: hydrate_probe
        shell: bash
        run: |
          set -euo pipefail
          missing=""
          for f in $ASSESSMENT_RUNTIME_FILES; do
            [[ -e "$f" ]] || missing="$missing $f"
          done
          if [[ -n "$missing" ]]; then
            echo "needed=true" >> "$GITHUB_OUTPUT"
            echo "Hydration required for:$missing"
          else
            echo "needed=false" >> "$GITHUB_OUTPUT"
            echo "Caller ships the full assessment runtime — no hydration."
          fi
          # The runners import yaml to parse agent/skill frontmatter. Hosted
          # images happen to ship PyYAML, which has kept this an undeclared
          # dependency; slim and self-hosted runners do not.
          if ! python3 -c "import yaml" 2>/dev/null; then
            python3 -m pip install --quiet --disable-pip-version-check pyyaml
          fi

      - name: Check out pack for hydration
        if: steps.hydrate_probe.outputs.needed == 'true'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          repository: Manolii-org/ai-starter-pack
          ref: ${{ inputs.pack_ref }}
          path: .pack-hydrate
          persist-credentials: false
          # Only the two trees ASSESSMENT_RUNTIME_FILES can name — the rest of
          # the pack (kernel, docs, prompts, telemetry) is dead weight here.
          sparse-checkout: |
            scripts
            .claude

      - name: Hydrate assessment runtime
        if: steps.hydrate_probe.outputs.needed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          for f in $ASSESSMENT_RUNTIME_FILES; do
            [[ -e "$f" ]] && continue
            if [[ ! -e ".pack-hydrate/$f" ]]; then
              # A listed path the pack no longer ships means this list and the
              # runners have drifted. Continuing would resurface later as an
              # opaque FileNotFoundError inside a runner.
              echo "::error::$f is not present in the pack at '${{ inputs.pack_ref }}'"
              exit 1
            fi
            mkdir -p "$(dirname "$f")"
            cp ".pack-hydrate/$f" "$f"
            echo "hydrated $f"
          done
          chmod +x scripts/run-*.py 2>/dev/null || true
          # Scratch tree: leaving a second full copy of the pack in the
          # workspace would be walked by later steps (skill discovery,
          # artifact globs) and by the caller's own tooling.
          rm -rf .pack-hydrate

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: sast-findings
          path: .ai/

      - name: Run broad agents
        env:
          AGENTS: ${{ needs.classify.outputs.invoke_agents }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          mkdir -p .ai/candidates
          git diff "origin/${BASE_REF}...HEAD" > /tmp/pr.diff
          python3 scripts/run-broad-agents.py \
            --agents "$AGENTS" \
            --diff /tmp/pr.diff \
            --candidates-dir .ai/candidates/

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: broad-candidates
          path: .ai/candidates/

  judge:
    name: Judge
    runs-on: ${{ inputs.runs_on }}
    needs: [classify, specialists, broad-agents]
    if: always() && needs.classify.result == 'success' && needs.classify.outputs.depth != 'none'
    # Provider env — all steps inherit; empty ANTHROPIC_BASE_URL is a no-op for anthropic mode.
    env:
      ANTHROPIC_API_KEY: ${{ inputs.provider_mode == 'proxy' && secrets.LITELLM_MASTER_KEY || secrets.ANTHROPIC_API_KEY }}
      ANTHROPIC_BASE_URL: ${{ inputs.provider_mode == 'proxy' && inputs.litellm_proxy_url || '' }}
      ANTHROPIC_MODEL: ${{ inputs.model }}
    steps:
      - name: Validate provider secrets
        env:
          PM: ${{ inputs.provider_mode }}
          AK: ${{ secrets.ANTHROPIC_API_KEY }}
          LK: ${{ secrets.LITELLM_MASTER_KEY }}
          PURL: ${{ inputs.litellm_proxy_url }}
        run: |
          if [[ "$PM" == "proxy" ]]; then
            if [[ -z "$LK" ]]; then echo "::error::provider_mode=proxy requires LITELLM_MASTER_KEY"; exit 1; fi
            if [[ -z "$PURL" ]]; then echo "::error::provider_mode=proxy requires litellm_proxy_url"; exit 1; fi
          else
            if [[ -z "$AK" ]]; then echo "::error::provider_mode=anthropic requires ANTHROPIC_API_KEY"; exit 1; fi
          fi

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      # ── Assessment runtime hydration ────────────────────────────────────
      # The probe runs first and fetches NOTHING when the caller already ships
