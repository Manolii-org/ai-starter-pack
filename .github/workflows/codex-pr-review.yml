# Credential-free review requests / authenticated coverage and recovery.
name: Codex PR Review (advisory)
concurrency:
  group: codex-pr-review-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  pull-requests: read
  actions: read
jobs:
  review:
    name: Codex review (subscription)
    runs-on: ubuntu-slim
    timeout-minutes: 1
    continue-on-error: true
    if: github.event.pull_request.draft != true
    steps:
    - name: Request trusted default-branch review
      run: echo "Review requested. Model execution occurs only in the trusted default-branch worker; this PR job has no subscription
        credentials."
  completion:
    name: Codex review coverage
    if: always() && github.event.pull_request.draft != true
    needs: review
    runs-on: ubuntu-slim
    timeout-minutes: 2
    permissions:
      contents: read
      pull-requests: read
      actions: read
    steps:
    - name: Require authenticated native review evidence
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
      env:
        EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
      with:
        script: |
          const {owner, repo} = context.repo;
          const pull_number = context.payload.pull_request.number;
          const head = process.env.EXPECTED_HEAD;
          const live = await github.rest.pulls.get({owner, repo, pull_number});
          if (live.data.head.sha !== head) {
            core.setFailed('Superseded revision; a later head must have its own review.');
            return;
          }
          const [reviews, inlineComments, comments] = await Promise.all([
            github.paginate(github.rest.pulls.listReviews, {owner, repo, pull_number, per_page: 100}),
            github.paginate(github.rest.pulls.listReviewComments, {owner, repo, pull_number, per_page: 100}),
            github.paginate(github.rest.issues.listComments, {owner, repo, issue_number: pull_number, per_page: 100}),
          ]);
          const bot = item => item.user && item.user.login === 'chatgpt-codex-connector[bot]';
          const bad = item => /(?:^|\n)(?:you have reached your Codex usage limits|Codex usage limits have been reached)|connect to github|create a Codex account/i.test(item.body || '');
          const bound = async prefix => {
            if (typeof prefix !== 'string' || !/^[0-9a-f]{7,40}$/i.test(prefix)
                || !head.toLowerCase().startsWith(prefix.toLowerCase())) return false;
            if (prefix.length === 40) return true;
            // Native summary tables abbreviate SHAs. GitHub must resolve the
            // prefix uniquely; an ambiguous or stale prefix is never proof.
            try {
              const resolved = await github.rest.repos.getCommit({owner, repo, ref: prefix});
              return resolved.data.sha === head;
            } catch (error) {
              core.info('Native abbreviated commit could not be uniquely resolved.');
              return false;
            }
          };
          const codeReviews = reviews.filter(item => bot(item) && !bad(item) && item.commit_id === head
            && ['APPROVED','COMMENTED','CHANGES_REQUESTED','DISMISSED'].includes(String(item.state || '').toUpperCase())
            && /codex review/i.test(item.body || '')
            && !/codex-security-review|codex security review/i.test(item.body || ''));
          // Native inline findings are review evidence, not a clean verdict.
          // Require the native code-lane marker so security-only activity or
          // an arbitrary/relayed comment cannot satisfy code coverage.
          // GitHub remaps an old inline comment's commit_id as its line moves
          // to later heads. The parent review's commit is immutable evidence.
          const currentReviews = new Set(reviews.filter(item => bot(item) && !bad(item)
            && item.commit_id === head && ['APPROVED','COMMENTED','CHANGES_REQUESTED','DISMISSED'].includes(String(item.state || '').toUpperCase()))
            .map(item => Number(item.id)));
          const codeInline = inlineComments.some(item => bot(item) && !bad(item)
            && item.commit_id === head && item.original_commit_id === head && item.path && !item.in_reply_to_id
            && Number(item.pull_request_review_id) > 0
            && currentReviews.has(Number(item.pull_request_review_id))
            && /<!-- codex-code-review-finding:v1 -->\s*$/.test(item.body || ''));
          const prefixes = new Set();
          for (const item of comments.filter(bot)) {
            const body = item.body || '';
            if (!bad(item) && /codex review:[^\n]*didn.?t find any major issues/i.test(body)) {
              const clean = body.match(/reviewed commit:[^0-9a-f]*([0-9a-f]{7,40})/i);
              if (clean) prefixes.add(clean[1]);
            }
            for (const line of body.split('\n')) {
              const cells = line.split('|').map(cell => cell.trim());
              // Match the status cell, not a word in another column/lane.
              if (!/\*\*Code Review\*\*/i.test(cells[1] || '')
                  || !/^✅\s*\*\*Completed\*\*(?:\s*<relative-time[^>]*>[^<]*<\/relative-time>)?$/i.test(cells[2] || '')) continue;
              const commit = (cells[3] || '').match(/^`([0-9a-f]{7,40})`$/i);
              if (commit) prefixes.add(commit[1]);
            }
          }
          let native = codeReviews.length > 0 || codeInline;
          for (const prefix of prefixes) {
            if (native) break;
            native = await bound(prefix);
          }
          if (native) {
            core.info('code review coverage completed through authenticated native Codex evidence for ' + head);
            return;
          }
          core.setFailed('code review coverage incomplete (' + 'awaiting trusted worker' + '). No current-head CLI or native completion proof.');
      id: native
      continue-on-error: true
    - name: Check out immutable base proof reader
      if: steps.native.outcome != 'success'
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        ref: ${{ github.event.pull_request.base.sha }}
        path: trusted
        persist-credentials: false
        sparse-checkout: scripts/ci
        sparse-checkout-cone-mode: true
    - name: Validate authenticated worker artifact
      id: proof
      if: steps.native.outcome != 'success'
      continue-on-error: true
      env:
        GH_TOKEN: ${{ github.token }}
      run: python3 -I trusted/scripts/ci/codex_review_worker.py coverage --lane code
    - name: Require completed review coverage
      if: always() && steps.native.outcome != 'success' && steps.proof.outcome != 'success'
      run: |
        echo "::error::No current-revision authenticated native or trusted worker proof. Review coverage is incomplete."
        exit 1
'on':
  pull_request:
    types:
    - opened
    - synchronize
    - reopened
    - ready_for_review
    - converted_to_draft
