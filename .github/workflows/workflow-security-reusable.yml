name: Workflow Security (reusable)
# Consumer-side workflow hardening:
#   1. Every `uses:` in the caller's workflows and composite actions is pinned
#      to a full commit SHA (fails otherwise). Tag pins of shared reusables run
#      whatever the tag points at today — with the caller's secrets.
#   2. actionlint on the caller's workflows (fails on errors).
#   3. zizmor workflow-security audit: ratchet against the caller's baseline
#      when `zizmor_baseline` exists in the caller repo; report-only otherwise.
#
# Usage (pin this reusable by SHA, with a version trailer for Renovate):
#   jobs:
#     workflow-security:
#       uses: Manolii-org/ai-starter-pack/.github/workflows/workflow-security-reusable.yml@<sha> # vX.Y.Z
#
# Needs no secrets.

on:
  workflow_call:
    inputs:
      zizmor_baseline:
        description: 'Path in the caller repo to a zizmor baseline (created with --write-baseline). Missing file = report-only.'
        required: false
        type: string
        default: 'config/zizmor-baseline.json'
      allow_ref:
        description: 'Optional newline-separated full-match regexes for uses: refs to exempt from SHA pinning.'
        required: false
        type: string
        default: ''
      pack_ref:
        description: 'Override the pack revision providing the scripts. Default: this reusable workflow''s own pinned commit.'
        required: false
        type: string
        default: ''
      runs_on:
        description: 'Runner label. ubuntu-slim is sufficient (pure Python + static binaries, no sudo).'
        required: false
        type: string
        default: 'ubuntu-latest'
      changed_only:
        description: >-
          On pull_request and merge_group, skip the scan visibly unless a
          workflow, composite action or action.yml file changed. Schedule,
          push and dispatch always scan. Change detection uses the compare API
          and fails safe (scans) on any error or a 300-file response.
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  scan:
    name: Workflow security
    runs-on: ${{ inputs.runs_on }}
    timeout-minutes: 10
    steps:
      - name: Resolve pack revision
        # job.workflow_sha is the commit of the workflow file that defines this
        # job — for a reusable workflow, the caller's pinned pack commit. If it
        # ever resolved empty, checkout would silently fall back to the pack's
        # default branch (mutable code with the caller's token), so fail loudly
        # instead and ask for an explicit pack_ref.
        id: pack
        env:
          PACK_REF: ${{ inputs.pack_ref || job.workflow_sha }}
        run: |
          if [ -z "$PACK_REF" ]; then
            echo "::error::Could not resolve this workflow's own pack commit; pass pack_ref: <40-char commit SHA>"
            exit 1
          fi
          echo "ref=$PACK_REF" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: '3.12'

      - name: Detect workflow changes
        id: changes
        env:
          CHANGED_ONLY: ${{ inputs.changed_only }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          API: ${{ github.api_url }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
        run: |
          python3 - <<'PY'
          import json, os, re, urllib.request
          relevant = "true"
          base, head = os.environ.get("BASE", ""), os.environ.get("HEAD", "")
          if os.environ.get("CHANGED_ONLY") == "true" and base and head:
              try:
                  req = urllib.request.Request(
                      f"{os.environ['API']}/repos/{os.environ['REPO']}/compare/{base}...{head}",
                      headers={"Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                               "Accept": "application/vnd.github+json"})
                  with urllib.request.urlopen(req, timeout=30) as r:
                      files = [f["filename"] for f in json.load(r).get("files", [])]
                  pattern = re.compile(r"^\.github/(workflows|actions)/|(^|/)action\.ya?ml$")
                  if len(files) < 300 and not any(pattern.search(f) for f in files):
                      relevant = "false"
                      print("::notice::No workflow or action files changed; workflow security skipped (changed_only)")
              except Exception as exc:  # fail safe: scan
                  print(f"::warning::Change detection failed ({type(exc).__name__}); scanning")
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"relevant={relevant}\n")
          PY

      - name: Checkout caller
        if: steps.changes.outputs.relevant == 'true'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          path: caller
          persist-credentials: false

      - name: Checkout pack scripts (this workflow's own revision)
        if: steps.changes.outputs.relevant == 'true'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          repository: manolii-org/ai-starter-pack
          ref: ${{ steps.pack.outputs.ref }}
          path: pack
          persist-credentials: false

      - name: Install pinned scanners
        if: steps.changes.outputs.relevant == 'true'
        run: |
          bash pack/scripts/install-workflow-scanners.sh "$RUNNER_TEMP/bin"
          python3 -m pip install --quiet --disable-pip-version-check --require-hashes --only-binary=:all: -r pack/config/workflow-security-requirements.txt
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Every uses is SHA-pinned
        if: steps.changes.outputs.relevant == 'true'
        env:
          ALLOW_REF: ${{ inputs.allow_ref }}
        run: |
          args=()
          while IFS= read -r rx; do
            [ -n "$rx" ] && args+=(--allow-ref "$rx")
          done <<< "$ALLOW_REF"
          cd caller
          python3 ../pack/scripts/check-pinned-uses.py "${args[@]}"

      - name: actionlint
        if: steps.changes.outputs.relevant == 'true'
        working-directory: caller
        run: python3 ../pack/scripts/check-pinned-uses.py --actionlint

      - name: zizmor
        if: steps.changes.outputs.relevant == 'true'
        working-directory: caller
        env:
          BASELINE: ${{ inputs.zizmor_baseline }}
        run: |
          if [ -f "$BASELINE" ]; then
            python3 ../pack/scripts/workflow-security-ratchet.py --baseline "$BASELINE"
          else
            echo "::notice::No zizmor baseline at $BASELINE — report-only. Create one with: python3 scripts/workflow-security-ratchet.py --write-baseline --baseline $BASELINE"
            # Same surface as the ratchet: workflows plus composite actions.
            targets=(.github/workflows)
            [ -d .github/actions ] && targets+=(.github/actions)
            zizmor --offline --no-progress --format github "${targets[@]}" || true
          fi
