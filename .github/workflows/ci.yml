name: CI
# GitHub Actions steps legitimately mix uses/run shapes within one job.
# config-completeness-ignore: uses
# config-completeness-ignore: run
# config-completeness-ignore: id

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: this pipeline only reads the repository. Mirrors
# ci-reusable.yml — widen per-job if a step needs to write.
permissions:
  contents: read

# Single source for the Node version. The cache key embeds it, so bumping this
# one value both installs and invalidates correctly. Previously the key carried
# a hardcoded `node20` label while setup-node installed 24, so a version bump
# silently restored node_modules built for the old runtime.
env:
  NODE_VERSION: '24'

jobs:
  outcome-contract:
    name: Workflow Outcome Contract
    runs-on: >-
      ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
          && fromJSON(vars.LIGHT_RUNNER || '["ubuntu-slim"]')
          || 'ubuntu-latest' }}
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Validate explicit workflow outcomes
        run: |
          if [ -f scripts/lint-workflow-outcomes.py ] && [ -f config/workflow-outcomes.json ]; then
            python3 scripts/lint-workflow-outcomes.py
          elif [ -f scripts/lint-workflow-outcomes.py ] || [ -f config/workflow-outcomes.json ]; then
            echo "Partial workflow-outcome adoption: script and config must be committed together" >&2
            exit 1
          fi

  # hashFiles() is only valid in step-level contexts, so job gating on
  # package.json presence goes through this job's output instead.
  detect:
    name: Detect Project
    runs-on: >-
      ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
          && fromJSON(vars.LIGHT_RUNNER || '["ubuntu-slim"]')
          || 'ubuntu-latest' }}
    timeout-minutes: 14
    outputs:
      has_pkg: ${{ steps.detect.outputs.has_pkg }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - id: detect
        # Lockfiles count too: a PR that deletes package.json but leaves a
        # lockfile still runs CI (and fails loudly at install) instead of
        # silently skipping the whole pipeline.
        run: echo "has_pkg=$({ [ -f package.json ] || [ -f package-lock.json ] || [ -f pnpm-lock.yaml ] || [ -f yarn.lock ] || [ -f bun.lockb ] || [ -f bun.lock ]; } && echo true || echo false)" >> "$GITHUB_OUTPUT"

  validate:
    name: Validate project
    if: needs.detect.outputs.has_pkg == 'true'
    # One install serves the validation commands. Build keeps its own runner
    # selector and runs only after validation succeeds.
    runs-on: >-
      ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
          && fromJSON(vars.LIGHT_RUNNER || '["ubuntu-latest"]')
          || 'ubuntu-latest' }}
    timeout-minutes: 30
    needs: [detect]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          # Uncomment the appropriate cache line for your package manager:
          # cache: 'npm'
          # cache: 'pnpm'
      - name: Identify runtime for dependency cache
        id: node-runtime
        shell: bash
        run: node -e 'require("node:fs").appendFileSync(process.env.GITHUB_OUTPUT, `version=${process.versions.node}\nabi=${process.versions.modules}\n`)'
      - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        id: cache-node-modules
        with:
          path: node_modules
          key: nm-v2-${{ runner.os }}-${{ runner.arch }}-node-${{ steps.node-runtime.outputs.version }}-abi-${{ steps.node-runtime.outputs.abi }}-${{ hashFiles('package-lock.json', 'pnpm-lock.yaml', 'yarn.lock', 'bun.lockb', 'bun.lock') }}
      - name: Install dependencies
        id: dependencies
        run: |
          if [ "${{ steps.cache-node-modules.outputs.cache-hit }}" != true ]; then
            npm ci
          fi
      - name: Security audit
        run: npm audit --audit-level=high
      - name: Lint
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: npx eslint .
      - name: Type check
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: npx tsc --noEmit
      - name: Unit tests with coverage
        id: unit-tests
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: npm test -- --coverage
      - name: Feature-control Python and cross-language conformance
        id: conformance
        if: ${{ !cancelled() && steps.unit-tests.outcome == 'success' && hashFiles('packages/feature-controls/python/pyproject.toml') != '' }}
        run: |
          python3 -m venv "$RUNNER_TEMP/feature-control-conformance"
          "$RUNNER_TEMP/feature-control-conformance/bin/pip" install --quiet -e ./packages/feature-controls/python pytest==8.3.5
          "$RUNNER_TEMP/feature-control-conformance/bin/python" -m pytest -q tests/feature_controls/provider_conformance.py tests/feature_controls/release_policy_conformance.py tests/feature_controls/release_policy_tool_conformance.py
      - name: Feature release source declaration
        if: ${{ !cancelled() && steps.conformance.outcome == 'success' }}
        run: |
          "$RUNNER_TEMP/feature-control-conformance/bin/python" scripts/feature-release-check.py \
            --repo-root "$GITHUB_WORKSPACE" --mode source --summary "$GITHUB_STEP_SUMMARY"
      # Uncomment to upload coverage to a service (Codecov, Coveralls, etc.):
      # - uses: codecov/codecov-action@v4
      #   with:
      #     token: ${{ secrets.CODECOV_TOKEN }}
      #     fail_ci_if_error: false

  build:
    name: Build
    needs: [validate]
    # This file is a starter-pack template: non-fleet consumers have no Fly
    # pool, so the default must stay hosted — fleet tenants opt in by setting
    # CI_RUNNER_OVERRIDE (fly-runner-setup.md). Fork PRs always fall back to
    # hosted even when the var is set.
    runs-on: >-
      ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
          && fromJSON(vars.CI_RUNNER_OVERRIDE || '["ubuntu-latest"]')
          || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Identify runtime for dependency cache
        id: node-runtime
        shell: bash
        run: node -e 'require("node:fs").appendFileSync(process.env.GITHUB_OUTPUT, `version=${process.versions.node}\nabi=${process.versions.modules}\n`)'
      - uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: node_modules
          key: nm-v2-${{ runner.os }}-${{ runner.arch }}-node-${{ steps.node-runtime.outputs.version }}-abi-${{ steps.node-runtime.outputs.abi }}-${{ hashFiles('package-lock.json', 'pnpm-lock.yaml', 'yarn.lock', 'bun.lockb', 'bun.lock') }}
      - name: Fallback install if cache miss
        run: test -d node_modules || npm ci
      - run: npm run build
