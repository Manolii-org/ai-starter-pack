# Trusted control source: generated payloads are checked by scripts/sync-autofix-control.py.
name: PR Autofix Loop
on:
  issue_comment:
    types:
    - created
  pull_request_review:
    types:
    - submitted
  pull_request_review_comment:
    types:
    - created
  workflow_run:
    types:
    - completed
    workflows:
    - CI
    - Static Review
    - PR Assessment
    - Secret Scan
permissions:
  contents: read
  pull-requests: write
  issues: write
jobs:
  preflight:
    name: Autofix Preflight
    runs-on: ${{ fromJSON(vars.LIGHT_RUNNER || '["ubuntu-slim"]') }}
    timeout-minutes: 10
    if: |
      (
        (
          github.event_name == 'pull_request_review' &&
          contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.review.author_association) &&
          github.actor != 'github-actions[bot]'
        ) ||
        (
          github.event_name == 'pull_request_review_comment' &&
          contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) &&
          github.actor != 'github-actions[bot]'
        ) ||
        (
          github.event_name == 'issue_comment' &&
          github.event.issue.pull_request &&
          (
            (
              contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) &&
              github.actor != 'github-actions[bot]'
            ) ||
            (
              github.actor == 'github-actions[bot]' &&
              startsWith(github.event.comment.body, '**[@')
            )
          )
        ) ||
        (
          github.event_name == 'workflow_run' &&
          github.event.workflow_run.conclusion == 'failure' &&
          github.event.workflow_run.event == 'pull_request' &&
          github.event.workflow_run.pull_requests[0] != null
        )
      ) &&
      github.actor != 'dependabot[bot]' &&
      github.actor != 'renovate[bot]'
    outputs:
      skip: ${{ steps.gate.outputs.skip }}
      pr_number: ${{ steps.ref.outputs.pr_number }}
      head_ref: ${{ steps.ref.outputs.head_ref }}
      head_sha: ${{ steps.pr.outputs.head_sha }}
      trigger_workflow: ${{ steps.pr.outputs.trigger_workflow }}
      trigger_run_url: ${{ steps.pr.outputs.trigger_run_url }}
      allowed_bots: ${{ steps.pr.outputs.allowed_bots }}
    steps:
    - name: Resolve PR number and head ref
      id: ref
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        EVENT_NAME: ${{ github.event_name }}
        PR_HEAD_REF: ${{ github.event.pull_request.head.ref || '' }}
        ISSUE_NUM: ${{ github.event.issue.number || '' }}
        PR_NUM_DIRECT: ${{ github.event.pull_request.number || '' }}
        WR_PR_NUM: ${{ github.event.workflow_run.pull_requests[0].number || '' }}
        WR_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch || '' }}
        WR_HEAD_SHA: ${{ github.event.workflow_run.head_sha || '' }}
        WR_FORK: ${{ github.event.workflow_run.head_repository.fork || false }}
        WR_HEAD_REPO_ID: ${{ github.event.workflow_run.head_repository.id || '' }}
        REPO_ID: ${{ github.event.repository.id }}
        REPOSITORY: ${{ github.repository }}
      run: "set -euo pipefail\nif [[ \"$EVENT_NAME\" == \"workflow_run\" ]]; then\n  if [[ \"$WR_FORK\" == \"true\" ]]; then\n    echo \"skip=true\"\
        \ >> \"$GITHUB_OUTPUT\"\n    echo \"Fork PR workflow_run \u2014 no secrets; skipping\"\n    exit 0\n  fi\n  # Bind the triggering run\
        \ itself to this repository: .fork is\n  # false for a PR from the upstream of a forked deployment.\n  if [[ -z \"$WR_HEAD_REPO_ID\" ||\
        \ \"$WR_HEAD_REPO_ID\" != \"$REPO_ID\" ]]; then\n    echo \"skip=true\" >> \"$GITHUB_OUTPUT\"\n    echo \"workflow_run head repository\
        \ is not this repository; skipping\"\n    exit 0\n  fi\n  PR_NUM=\"${WR_PR_NUM}\"\n  HEAD_REF=\"${WR_HEAD_BRANCH}\"\nelse\n  PR_NUM=\"\
        ${PR_NUM_DIRECT:-$ISSUE_NUM}\"\n  HEAD_REF=\"${PR_HEAD_REF:-}\"\nfi\nif [[ -z \"$PR_NUM\" ]]; then\n  echo \"skip=true\" >> \"$GITHUB_OUTPUT\"\
        \n  echo \"No PR number; skipping\"\n  exit 0\nfi\nif [[ \"$EVENT_NAME\" == \"workflow_run\" ]]; then\n  CURRENT_HEAD_SHA=$(gh api \"\
        repos/${REPOSITORY}/pulls/${PR_NUM}\" --jq '.head.sha' 2>/dev/null || echo '')\n  if [[ -n \"$WR_HEAD_SHA\" && -n \"$CURRENT_HEAD_SHA\"\
        \ && \"$WR_HEAD_SHA\" != \"$CURRENT_HEAD_SHA\" ]]; then\n    echo \"skip=true\" >> \"$GITHUB_OUTPUT\"\n    echo \"Stale workflow_run:\
        \ ${WR_HEAD_SHA} is not current PR head ${CURRENT_HEAD_SHA}; skipping before checkout and agent dispatch\"\n    exit 0\n  fi\nfi\nif [[\
        \ -z \"$HEAD_REF\" ]]; then\n  # issue_comment payloads carry issue.number but no pull_request\n  # section \u2014 resolve the head branch\
        \ over the API. Without --repo,\n  # gh resolves the repository from cwd's git remotes, and this job\n  # has no checkout, so the call\
        \ would fail and HEAD_REF stayed\n  # empty \u2014 aborting the heavy job on `git checkout -B \"\"` later.\n  HEAD_REF=$(timeout -k 5\
        \ 30 gh pr view \"$PR_NUM\" --repo \"$REPOSITORY\" --json headRefName --jq '.headRefName' 2>/dev/null || echo '')\nfi\nif [[ -z \"$HEAD_REF\"\
        \ ]]; then\n  echo \"skip=true\" >> \"$GITHUB_OUTPUT\"\n  echo \"head_ref unresolvable for ${EVENT_NAME} event \u2014 skipping before\
        \ the heavy job\"\n  exit 0\nfi\necho \"skip=false\" >> \"$GITHUB_OUTPUT\"\necho \"pr_number=$PR_NUM\" >> \"$GITHUB_OUTPUT\"\necho \"\
        head_ref=$HEAD_REF\" >> \"$GITHUB_OUTPUT\"\n"
    - name: Determine skip conditions
      id: pr
      if: steps.ref.outputs.skip != 'true'
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        EVENT_NAME: ${{ github.event_name }}
        COMMENT_BODY: ${{ github.event.comment.body || github.event.review.body || '' }}
        PR_NUM: ${{ steps.ref.outputs.pr_number }}
        ACTOR: ${{ github.actor }}
        WR_ACTOR: ${{ github.event.workflow_run.actor.login || '' }}
        TRUSTED_BOTS: ${{ vars.AUTOFIX_TRUSTED_AGENT_BOTS }}
        WR_NAME: ${{ github.event.workflow_run.name || '' }}
        WR_URL: ${{ github.event.workflow_run.html_url || '' }}
        REPOSITORY: ${{ github.repository }}
        REVIEW_STATE: ${{ github.event.review.state }}
      run: "set -euo pipefail\necho \"number=$PR_NUM\" >> \"$GITHUB_OUTPUT\"\necho \"trigger_workflow=$WR_NAME\" >> \"$GITHUB_OUTPUT\"\necho \"\
        trigger_run_url=$WR_URL\" >> \"$GITHUB_OUTPUT\"\n\n# Loop break: prior autofix commit still HEAD. Preflight has no\n# checkout \u2014\
        \ read the head commit message via the API instead of\n# `git log` (same assertion: subject starts with [autofix]).\nPR_HEAD=$(timeout\
        \ 20 gh api \"repos/${REPOSITORY}/pulls/${PR_NUM}\" \\\n  --jq '. as $pr | $pr.head | {sha: .sha, same_repo: (if .repo == null then \"\
        missing\" elif (.repo.id == $pr.base.repo.id) then \"true\" else \"false\" end)}' \\\n  2>/dev/null || echo '{}')\nHEAD_SHA=$(echo \"\
        $PR_HEAD\" | jq -r '.sha // empty')\nSAME_REPO=$(echo \"$PR_HEAD\" | jq -r '.same_repo // empty')\necho \"head_sha=$HEAD_SHA\" >> \"$GITHUB_OUTPUT\"\
        \nif [[ -z \"$HEAD_SHA\" ]]; then\n  # Fail closed: an empty SHA would fall back to movable head_ref in\n  # the autofix checkout \u2014\
        \ unvalidated commit. Skip instead.\n  echo \"skip=true\" >> \"$GITHUB_OUTPUT\"\n  echo \"Could not resolve PR head SHA; skipping\"\n\
        \  exit 0\nfi\nif [[ \"$SAME_REPO\" != \"true\" ]]; then\n  # Compare repo IDs, not .fork (pr-autofix-loop-reusable.yml): a\n  # forked\
        \ deployment repo has fork=true on its own PRs, and a\n  # deleted head has repo=null \u2014 both must fail closed. A cross-repo\n  #\
        \ head is attacker-controlled code under write perms + agent creds\n  # on issue_comment/pull_request triggers.\n  echo \"skip=true\"\
        \ >> \"$GITHUB_OUTPUT\"\n  echo \"Cross-repo/unverifiable PR head (same_repo=$SAME_REPO) \u2014 refusing privileged autofix checkout\"\
        \n  exit 0\nfi\nLAST_MSG=''\nif [[ -n \"$HEAD_SHA\" ]]; then\n  LAST_MSG=$(timeout 20 gh api \"repos/${REPOSITORY}/commits/${HEAD_SHA}\"\
        \ \\\n    --jq '.commit.message | split(\"\\n\")[0]' 2>/dev/null || echo '')\nfi\nif [[ \"$LAST_MSG\" == \\[autofix\\]* ]]; then\n  echo\
        \ \"skip=true\" >> \"$GITHUB_OUTPUT\"\n  echo \"Latest commit is [autofix]; skipping to avoid loop\"\n  exit 0\nfi\n\nif echo \"$COMMENT_BODY\"\
        \ | grep -qi \"skip-autofix\"; then\n  echo \"skip=true\" >> \"$GITHUB_OUTPUT\"\n  exit 0\nfi\n\n# Human issue_comment needs @claude;\
        \ relayed **[@ and workflow_run do not\nif [[ \"$EVENT_NAME\" == \"issue_comment\" ]]; then\n  if [[ \"$ACTOR\" == \"github-actions[bot]\"\
        \ ]] && [[ \"$COMMENT_BODY\" == '**[@'* ]]; then\n    : # relayed bot review \u2014 proceed\n  elif ! echo \"$COMMENT_BODY\" | grep -qi\
        \ \"@claude\"; then\n    echo \"skip=true\" >> \"$GITHUB_OUTPUT\"\n    exit 0\n  fi\nfi\n\nif [[ \"$EVENT_NAME\" == \"pull_request_review\"\
        \ ]]; then\n  if [[ \"$REVIEW_STATE\" == \"approved\" ]] && [[ -z \"$COMMENT_BODY\" || \"$COMMENT_BODY\" == \"null\" ]]; then\n    echo\
        \ \"skip=true\" >> \"$GITHUB_OUTPUT\"\n    exit 0\n  fi\nfi\n\n# Opt-in trusted agent bots (e.g. Devin, Codex cloud, Cursor\n# background\
        \ agents) whose pushes may trigger Autofix when CI fails.\n# Only on the workflow_run path, only for [bot] actors, matched like\n# the\
        \ action's allowed_bots (case-insensitive, [bot] optional); '*'\n# is never honoured. Fork heads were already refused above.\n# The action's\
        \ allowed_bots receives only this sanitised list, so a\n# '*' or malformed entry can never widen it either.\ntrusted_bots() {\n  local\
        \ entry\n  IFS=',' read -ra entries <<< \"${TRUSTED_BOTS:-}\"\n  for entry in \"${entries[@]}\"; do\n    entry=\"${entry#\"${entry%%[![:space:]]*}\"\
        }\"\n    entry=\"${entry%\"${entry##*[![:space:]]}\"}\"\n    entry=\"${entry,,}\"\n    entry=\"${entry%\\[bot\\]}\"\n    if [[ \"$entry\"\
        \ =~ ^[a-z0-9][a-z0-9-]*$ ]]; then echo \"$entry\"; fi\n  done\n}\ntrusted_bot() {\n  local who=\"${1,,}\" entry\n  who=\"${who%\\[bot\\\
        ]}\"\n  for entry in $(trusted_bots); do\n    [[ \"$entry\" == \"$who\" ]] && return 0\n  done\n  return 1\n}\n# Agent bots reach the\
        \ action only on the CI-failure path; comment\n# and review triggers keep the relay bot alone.\nallowed_bots=\"github-actions\"\nif [[\
        \ \"$EVENT_NAME\" == \"workflow_run\" ]]; then\n  for entry in $(trusted_bots); do allowed_bots+=\",$entry\"; done\nfi\necho \"allowed_bots=$allowed_bots\"\
        \ >> \"$GITHUB_OUTPUT\"\n\n# claude-code-action fails the job (rather than skipping) for bot\n# actors outside allowed_bots and for actors\
        \ without write access.\n# Only the relay bot and opted-in agent bots are allowed; skip\n# everything else before dispatch.\nfor who in\
        \ \"$ACTOR\" \"${WR_ACTOR:-}\"; do\n  [[ -z \"$who\" ]] && continue\n  if [[ \"$who\" == \"github-actions[bot]\" && \"$EVENT_NAME\" ==\
        \ \"issue_comment\" && \"$COMMENT_BODY\" == '**[@'* ]]; then\n    continue\n  fi\n  if [[ \"$EVENT_NAME\" == \"workflow_run\" && \"$who\"\
        \ == *\"[bot]\" ]] && trusted_bot \"$who\"; then\n    continue\n  fi\n  PERM=$(timeout -k 5 30 gh api \"repos/${REPOSITORY}/collaborators/${who}/permission\"\
        \ --jq '.permission' 2>/dev/null || echo unknown)\n  case \"$PERM\" in\n    admin|write) ;;\n    *)\n      echo \"skip=true\" >> \"$GITHUB_OUTPUT\"\
        \n      echo \"Actor ${who} has no write access or is a non-relay bot (permission=${PERM}); skipping\"\n      exit 0\n      ;;\n  esac\n\
        done\n\n# --repo required: this step runs with no checkout, so gh would\n# resolve the repo from cwd and fail. Failure must fail closed\
        \ \u2014\n# a label list we can't read might contain skip-ai-review.\nLABELS=$(timeout 20 gh pr view \"$PR_NUM\" --repo \"${REPOSITORY}\"\
        \ --json labels --jq '[.labels[].name]' 2>/dev/null || echo 'FAIL')\nif [[ \"$LABELS\" == \"FAIL\" ]] || echo \"$LABELS\" | grep -q \"\
        skip-ai-review\"; then\n  echo \"skip=true\" >> \"$GITHUB_OUTPUT\"\nelse\n  echo \"skip=false\" >> \"$GITHUB_OUTPUT\"\nfi\n"
    - name: Check retained execution owner
      id: custody
      if: steps.ref.outputs.skip != 'true' && steps.pr.outputs.skip != 'true'
      env:
        REPOSITORY: ${{ github.repository }}
        PR_NUMBER: ${{ steps.ref.outputs.pr_number }}
        EXPECTED_HEAD: ${{ steps.pr.outputs.head_sha }}
        GH_TOKEN: ${{ github.token }}
      run: |
        # autofix-control:guard:begin
        #!/usr/bin/env bash
        # Embedded into the trusted workflow by sync-autofix-control.py. Never source a PR copy.
        set -euo pipefail
        autofix_custody() {
          local pr author page comments count
          [[ "${PR_NUMBER:-}" =~ ^[1-9][0-9]*$ && "${EXPECTED_HEAD:-}" =~ ^[0-9a-f]{40}$ ]] || return 1
          if ! pr=$(timeout -k 5 30 gh api "repos/${REPOSITORY}/pulls/${PR_NUMBER}" 2>/dev/null); then
            echo 'Ownership readback unavailable; no editor or publication admitted.'
            return 1
          fi
          if ! jq -e --arg repo "$REPOSITORY" --arg head "$EXPECTED_HEAD" '
            .state == "open" and .head.sha == $head and
            (.head.repo.full_name | ascii_downcase) == ($repo | ascii_downcase) and
            (.user.id | type) == "number" and
            ([.labels[].name] | any(. == "skip-ai-review" or . == "human-merge" or . == "security-remediation") | not)
          ' <<< "$pr" >/dev/null; then
            echo 'Native PR state, head, fork or human hold prevents admission.'
            return 1
          fi
          if jq -e '(.body // "") | gsub("(?s)```.*?```"; "") | test("(?m)^X-Follow-Through-Owner:")' <<< "$pr" >/dev/null; then
            echo 'Existing session owner retained. No editor or publication admitted; GitHub facts remain with that owner.'
            return 1
          fi
          author=$(jq -r '.user.id' <<< "$pr")
          for page in 1 2 3 4 5; do
            if ! comments=$(timeout -k 5 30 gh api "repos/${REPOSITORY}/issues/${PR_NUMBER}/comments?per_page=100&page=${page}" 2>/dev/null) ||
               ! jq -e 'type == "array"' <<< "$comments" >/dev/null; then
              echo 'Owner registration readback incomplete; admission held.'
              return 1
            fi
            if jq -e --argjson author "$author" 'any(.[];
              (.user.id == $author or .user.id == 41898282) and
              ((.body // "") | startswith("<!-- follow-through-owner:v1 -->")))' <<< "$comments" >/dev/null; then
              echo 'Existing session owner retained by its registration. No editor or publication admitted.'
              return 1
            fi
            if jq -e --arg head "$EXPECTED_HEAD" 'any(.[];
              .user.id == 41898282 and ((.body // "") | test(
                "^<!-- pack-autofix-publication:v1 head=" + $head +
                " outcome=(publication_packet_held|publication_admission_held|native_state_held|instruction_surface_held|publication_credential_unavailable|publication_unknown|native_state_unverified|commit_subject_held|candidate_ancestry_held) -->")))' <<< "$comments" >/dev/null; then
              echo 'This head has held or uncertain publication. Its existing owner must recover retained work and resolve that dependency; new GitHub facts remain pending. No duplicate editor admitted.'
              return 1
            fi
            count=$(jq 'length' <<< "$comments")
            [[ "$count" -lt 100 ]] && return 0
          done
          echo 'Owner registration pagination bound reached; admission held.'
          return 1
        }
        if autofix_custody; then
          echo 'skip=false' >> "$GITHUB_OUTPUT"
        else
          echo 'skip=true' >> "$GITHUB_OUTPUT"
        fi
        # autofix-control:guard:end
    - name: Enforce per-PR successful-fix budget
      id: budget
      if: steps.ref.outputs.skip != 'true' && steps.pr.outputs.skip != 'true' && steps.custody.outputs.skip == 'false'
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        PR_NUM: ${{ steps.pr.outputs.number }}
        MAX_FIXES: '1'
        REPOSITORY: ${{ github.repository }}
      run: "set -euo pipefail\nMAX_FIXES=\"${MAX_FIXES:-1}\"\nif [[ ! \"$MAX_FIXES\" =~ ^[0-9]+$ ]]; then echo \"skip=true\" >> \"$GITHUB_OUTPUT\"\
        ; exit 0; fi\n# Count commits on this PR whose subject starts with [autofix]\nif ! COUNT=$(timeout -k 5 30 gh api \"repos/${REPOSITORY}/pulls/${PR_NUM}/commits\"\
        \ --paginate \\\n  --jq '[.[].commit.message | split(\"\\n\")[0] | select(startswith(\"[autofix]\"))] | length' 2>/dev/null \\\n  | awk\
        \ '{s+=$1} END {print s+0}'); then\n  echo \"skip=true\" >> \"$GITHUB_OUTPUT\"\n  echo \"::notice::Commit enumeration failed/timed out\
        \ \u2014 budget unverifiable; skipping\"\n  exit 0\nfi\necho \"successful_fix_commits=$COUNT\" >> \"$GITHUB_OUTPUT\"\nif [[ \"$COUNT\"\
        \ -ge \"$MAX_FIXES\" ]]; then\n  echo \"skip=true\" >> \"$GITHUB_OUTPUT\"\n  echo \"::notice::Per-PR autofix budget reached ($COUNT >=\
        \ $MAX_FIXES successful [autofix] commits); skipping\"\n  # autofix-control:budget-notice:begin\n  #!/usr/bin/env bash\n  # One material\
        \ budget receipt; repeated exhausted-budget wakes stay quiet.\n  notice=unknown\n  for page in 1 2 3 4 5; do\n    if ! comments=$(timeout\
        \ -k 5 30 gh api \"repos/${REPOSITORY}/issues/${PR_NUM}/comments?per_page=100&page=${page}\" 2>/dev/null); then break; fi\n    if ! jq\
        \ -e 'type == \"array\"' <<< \"$comments\" >/dev/null; then break; fi\n    if jq -e 'any(.[]; .user.id == 41898282 and ((.body // \"\"\
        ) | startswith(\"<!-- pack-autofix:budget-exhausted -->\")))' <<< \"$comments\" >/dev/null; then\n      notice=seen; break\n    fi\n \
        \   if [[ $(jq 'length' <<< \"$comments\") -lt 100 ]]; then notice=absent; break; fi\n  done\n  if [[ \"$notice\" == absent ]]; then\n\
        \    timeout -k 5 30 gh pr comment \"$PR_NUM\" --repo \"$REPOSITORY\" --body \"<!-- pack-autofix:budget-exhausted --> Autofix reached\
        \ its configured successful-fix budget (${COUNT}/${MAX_FIXES}). The original owner retains unfinished commitments. Do not remove commits,\
        \ reset counters or switch owners to evade this budget.\" || true\n  fi\n  # autofix-control:budget-notice:end\nelse\n  echo \"skip=false\"\
        \ >> \"$GITHUB_OUTPUT\"\nfi\n"
    - name: "Gate \u2014 combine skip decisions"
      id: gate
      env:
        REF_SKIP: ${{ steps.ref.outputs.skip }}
        PR_SKIP: ${{ steps.pr.outputs.skip }}
        CUSTODY_SKIP: ${{ steps.custody.outputs.skip }}
        BUDGET_SKIP: ${{ steps.budget.outputs.skip }}
      run: |
        set -euo pipefail
        if [[ "$CUSTODY_SKIP" == "true" || "$REF_SKIP" == "true" || "$PR_SKIP" == "true" || "$BUDGET_SKIP" == "true" ]]; then
          echo "skip=true" >> "$GITHUB_OUTPUT"
        else
          echo "skip=false" >> "$GITHUB_OUTPUT"
        fi
  autofix:
    name: Autofix PR
    needs: preflight
    if: needs.preflight.outputs.skip != 'true'
    concurrency:
      group: autofix-${{ github.repository }}-${{ needs.preflight.outputs.pr_number }}
      cancel-in-progress: false
    uses: ./.github/workflows/pr-autofix-execution-reusable.yml
    with:
      variant: standalone
      skip: ${{ needs.preflight.outputs.skip }}
      pr_number: ${{ needs.preflight.outputs.pr_number }}
      head_ref: ${{ needs.preflight.outputs.head_ref }}
      head_sha: ${{ needs.preflight.outputs.head_sha }}
      trigger_workflow: ${{ needs.preflight.outputs.trigger_workflow }}
      trigger_run_url: ${{ needs.preflight.outputs.trigger_run_url }}
      allowed_bots: ${{ needs.preflight.outputs.allowed_bots }}
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      LITELLM_MASTER_KEY: ${{ secrets.LITELLM_MASTER_KEY }}
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      MN_GH_AUTOMATION_TOKEN: ${{ secrets.MN_GH_AUTOMATION_TOKEN }}
