# Trusted control source: generated payloads are checked by scripts/sync-autofix-control.py.
name: PR Autofix Loop
on:
  issue_comment:
    types:
    - created
    - edited
  pull_request_review:
    types:
    - submitted
    - edited
  pull_request_review_comment:
    types:
    - created
    - edited
  workflow_run:
    types:
    - completed
    workflows:
    - CI
    - Static Review
    - PR Assessment
    - Secret Scan
permissions:
  contents: read
  pull-requests: write
  issues: write
jobs:
  preflight:
    name: Autofix Preflight
    runs-on: ${{ fromJSON(vars.LIGHT_RUNNER || '["ubuntu-slim"]') }}
    timeout-minutes: 10
    if: |-
      ((
        (
          github.event_name == 'pull_request_review' &&
          contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.review.author_association) &&
          github.actor != 'github-actions[bot]'
        ) ||
        (
          github.event_name == 'pull_request_review_comment' &&
          contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) &&
          github.actor != 'github-actions[bot]'
        ) ||
        (
          github.event_name == 'issue_comment' &&
          github.event.issue.pull_request &&
          (
            (
              contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) &&
              github.actor != 'github-actions[bot]'
            ) ||
            (
              github.actor_id == '41898282' &&
              startsWith(github.event.comment.body, '**[@')
            )
          )
        ) ||
        (
          github.event_name == 'workflow_run' &&
          github.event.workflow_run.conclusion == 'failure' &&
          github.event.workflow_run.event == 'pull_request' &&
          github.event.workflow_run.pull_requests[0] != null
        )
      ) &&
      github.actor != 'dependabot[bot]' &&
      github.actor != 'renovate[bot]') && github.event.action != 'edited' || (contains(fromJSON('["issue_comment","pull_request_review","pull_request_review_comment"]'), github.event_name) && github.event.sender.type == 'Bot' && contains(fromJSON(vars.AUTOFIX_TRUSTED_REVIEWER_IDS || '["199175422","136622811"]'), github.actor_id) && (github.event.comment.body || github.event.review.body || '') != '' && !contains((github.event.comment.body || github.event.review.body || ''), 'auto-generated reply by CodeRabbit') && ((contains((github.event.comment.body || github.event.review.body || ''), ' Badge') || contains((github.event.comment.body || github.event.review.body || ''), 'P0:') || contains((github.event.comment.body || github.event.review.body || ''), 'P1:') || contains((github.event.comment.body || github.event.review.body || ''), 'P2:') || contains((github.event.comment.body || github.event.review.body || ''), 'P3:') || contains((github.event.comment.body || github.event.review.body || ''), 'Critical**') || contains((github.event.comment.body || github.event.review.body || ''), 'Major**') || contains((github.event.comment.body || github.event.review.body || ''), 'Minor**') || contains((github.event.comment.body || github.event.review.body || ''), 'Nitpick**') || contains((github.event.comment.body || github.event.review.body || ''), 'Critical:') || contains((github.event.comment.body || github.event.review.body || ''), 'Major:') || contains((github.event.comment.body || github.event.review.body || ''), 'Minor:') || contains((github.event.comment.body || github.event.review.body || ''), 'Nitpick:') || contains((github.event.comment.body || github.event.review.body || ''), 'Potential issue') || contains((github.event.comment.body || github.event.review.body || ''), 'Actionable comments posted: 1') || contains((github.event.comment.body || github.event.review.body || ''), 'Actionable comments posted: 2') || contains((github.event.comment.body || github.event.review.body || ''), 'Actionable comments posted: 3') || contains((github.event.comment.body || github.event.review.body || ''), 'Actionable comments posted: 4')) || !(contains((github.event.comment.body || github.event.review.body || ''), 'codex-pull-request-review-summary') || contains((github.event.comment.body || github.event.review.body || ''), 'no security issues were found') || contains((github.event.comment.body || github.event.review.body || ''), 'Codex Review: Didn''t find any major issues.') || contains((github.event.comment.body || github.event.review.body || ''), 'Actionable comments posted: 0') || contains((github.event.comment.body || github.event.review.body || ''), 'rate limited by coderabbit.ai') || contains((github.event.comment.body || github.event.review.body || ''), 'skip review by coderabbit.ai') || contains((github.event.comment.body || github.event.review.body || ''), 'usage limit') || contains((github.event.comment.body || github.event.review.body || ''), 'BUGBOT_FREE_TIER_DISABLED_UPSELL'))))
    outputs:
      skip: ${{ steps.gate.outputs.skip }}
      pr_number: ${{ steps.ref.outputs.pr_number }}
      head_ref: ${{ steps.ref.outputs.head_ref }}
      head_sha: ${{ steps.pr.outputs.head_sha }}
      trigger_workflow: ${{ steps.pr.outputs.trigger_workflow }}
      trigger_run_url: ${{ steps.pr.outputs.trigger_run_url }}
      allowed_bots: ${{ steps.pr.outputs.allowed_bots }}
    steps:
    - name: Resolve PR number and head ref
      id: ref
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        EVENT_NAME: ${{ github.event_name }}
        PR_HEAD_REF: ${{ github.event.pull_request.head.ref || '' }}
        ISSUE_NUM: ${{ github.event.issue.number || '' }}
        PR_NUM_DIRECT: ${{ github.event.pull_request.number || '' }}
        WR_PR_NUM: ${{ github.event.workflow_run.pull_requests[0].number || '' }}
        WR_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch || '' }}
        WR_HEAD_SHA: ${{ github.event.workflow_run.head_sha || '' }}
        WR_FORK: ${{ github.event.workflow_run.head_repository.fork || false }}
        WR_HEAD_REPO_ID: ${{ github.event.workflow_run.head_repository.id || '' }}
        REPO_ID: ${{ github.event.repository.id }}
        REPOSITORY: ${{ github.repository }}
      run: |
        set -euo pipefail
        if [[ "$EVENT_NAME" == "workflow_run" ]]; then
          if [[ "$WR_FORK" == "true" ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Fork PR workflow_run — no secrets; skipping"
            exit 0
          fi
          # Bind the triggering run itself to this repository: .fork is
          # false for a PR from the upstream of a forked deployment.
          if [[ -z "$WR_HEAD_REPO_ID" || "$WR_HEAD_REPO_ID" != "$REPO_ID" ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "workflow_run head repository is not this repository; skipping"
            exit 0
          fi
          PR_NUM="${WR_PR_NUM}"
          HEAD_REF="${WR_HEAD_BRANCH}"
        else
          PR_NUM="${PR_NUM_DIRECT:-$ISSUE_NUM}"
          HEAD_REF="${PR_HEAD_REF:-}"
        fi
        if [[ -z "$PR_NUM" ]]; then
          echo "skip=true" >> "$GITHUB_OUTPUT"
          echo "No PR number; skipping"
          exit 0
        fi
        if [[ "$EVENT_NAME" == "workflow_run" ]]; then
          CURRENT_HEAD_SHA=$(gh api "repos/${REPOSITORY}/pulls/${PR_NUM}" --jq '.head.sha' 2>/dev/null || echo '')
          if [[ -n "$WR_HEAD_SHA" && -n "$CURRENT_HEAD_SHA" && "$WR_HEAD_SHA" != "$CURRENT_HEAD_SHA" ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Stale workflow_run: ${WR_HEAD_SHA} is not current PR head ${CURRENT_HEAD_SHA}; skipping before checkout and agent dispatch"
            exit 0
          fi
        fi
        if [[ -z "$HEAD_REF" ]]; then
          # issue_comment payloads carry issue.number but no pull_request
          # section — resolve the head branch over the API. Without --repo,
          # gh resolves the repository from cwd's git remotes, and this job
          # has no checkout, so the call would fail and HEAD_REF stayed
          # empty — aborting the heavy job on `git checkout -B ""` later.
          HEAD_REF=$(timeout -k 5 30 gh pr view "$PR_NUM" --repo "$REPOSITORY" --json headRefName --jq '.headRefName' 2>/dev/null || echo '')
        fi
        if [[ -z "$HEAD_REF" ]]; then
          echo "skip=true" >> "$GITHUB_OUTPUT"
          echo "head_ref unresolvable for ${EVENT_NAME} event — skipping before the heavy job"
          exit 0
        fi
        echo "skip=false" >> "$GITHUB_OUTPUT"
        echo "pr_number=$PR_NUM" >> "$GITHUB_OUTPUT"
        echo "head_ref=$HEAD_REF" >> "$GITHUB_OUTPUT"
    - name: Determine skip conditions
      id: pr
      if: steps.ref.outputs.skip != 'true'
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        EVENT_NAME: ${{ github.event_name }}
        COMMENT_BODY: ${{ github.event.comment.body || github.event.review.body || '' }}
        PR_NUM: ${{ steps.ref.outputs.pr_number }}
        ACTOR: ${{ github.actor }}
        WR_ACTOR: ${{ github.event.workflow_run.actor.login || '' }}
        TRUSTED_BOTS: ${{ vars.AUTOFIX_TRUSTED_AGENT_BOTS }}
        WR_NAME: ${{ github.event.workflow_run.name || '' }}
        WR_URL: ${{ github.event.workflow_run.html_url || '' }}
        REPOSITORY: ${{ github.repository }}
        REVIEW_STATE: ${{ github.event.review.state }}
        ACTOR_ID: ${{ github.actor_id }}
        ACTOR_TYPE: ${{ github.event.sender.type }}
        REVIEWER_IDS: ${{ vars.AUTOFIX_TRUSTED_REVIEWER_IDS || '["199175422","136622811"]' }}
        REVIEW_SOURCE_HEAD: ${{ github.event.review.commit_id || github.event.comment.commit_id || '' }}
        REVIEW_FINDING_PATTERN: \ Badge|P0:|P1:|P2:|P3:|Critical\*\*|Major\*\*|Minor\*\*|Nitpick\*\*|Critical:|Major:|Minor:|Nitpick:|Potential\
          issue|Actionable\ comments\ posted:\ 1|Actionable\ comments\ posted:\ 2|Actionable\ comments\ posted:\ 3|Actionable\ comments\ posted:\
          4
        REVIEW_INFORMATIONAL_PATTERN: codex\-pull\-request\-review\-summary|no\ security\ issues\ were\ found|Codex\ Review:\ Didn't\ find\ any\
          major\ issues\.|Actionable\ comments\ posted:\ 0|rate\ limited\ by\ coderabbit\.ai|skip\ review\ by\ coderabbit\.ai|usage\ limit|BUGBOT_FREE_TIER_DISABLED_UPSELL
        ADMITTED_REVIEW_HEAD: ''
      run: |
        # autofix-control:event:begin
        #!/usr/bin/env bash
        # Canonical native PR/event admission; embedded, never sourced from PR code.
        set -euo pipefail

        echo "number=$PR_NUM" >> "$GITHUB_OUTPUT"
        echo "trigger_workflow=$WR_NAME" >> "$GITHUB_OUTPUT"
        echo "trigger_run_url=$WR_URL" >> "$GITHUB_OUTPUT"

        # Loop break: prior autofix commit still HEAD. Preflight has no
        # checkout — read the head commit message via the API instead of
        # `git log` (same assertion: subject starts with [autofix]).
        PR_HEAD=$(timeout 20 gh api "repos/${REPOSITORY}/pulls/${PR_NUM}" \
          --jq '. as $pr | $pr.head | {sha: .sha, opener: ($pr.user.login // ""), same_repo: (if .repo == null then "missing" elif (.repo.id == $pr.base.repo.id) then "true" else "false" end)}' \
          2>/dev/null || echo '{}')
        HEAD_SHA=$(echo "$PR_HEAD" | jq -r '.sha // empty')
        SAME_REPO=$(echo "$PR_HEAD" | jq -r '.same_repo // empty')
        echo "head_sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"
        if [[ ! "$HEAD_SHA" =~ ^[0-9a-f]{40}$ || ( -n "${ADMITTED_REVIEW_HEAD:-}" && "$HEAD_SHA" != "$ADMITTED_REVIEW_HEAD" ) ]]; then
          # Fail closed: an empty SHA would fall back to movable head_ref in
          # the autofix checkout — unvalidated commit. Skip instead.
          echo "skip=true" >> "$GITHUB_OUTPUT"
          echo "Could not resolve PR head SHA; skipping"
          exit 0
        fi
        if [[ "$SAME_REPO" != "true" ]]; then
          # Compare repo IDs, not .fork (pr-autofix-loop-reusable.yml): a
          # forked deployment repo has fork=true on its own PRs, and a
          # deleted head has repo=null — both must fail closed. A cross-repo
          # head is attacker-controlled code under write perms + agent creds
          # on issue_comment/pull_request triggers.
          echo "skip=true" >> "$GITHUB_OUTPUT"
          echo "Cross-repo/unverifiable PR head (same_repo=$SAME_REPO) — refusing privileged autofix checkout"
          exit 0
        fi
        LAST_MSG=''
        if [[ -n "$HEAD_SHA" ]]; then
          if ! LAST_MSG=$(timeout 20 gh api "repos/${REPOSITORY}/commits/${HEAD_SHA}" \
            --jq '.commit.message | split("\n")[0]' 2>/dev/null); then
            echo 'skip=true' >> "$GITHUB_OUTPUT"
            echo 'Head commit metadata is unreadable; editor admission held.'
            exit 0
          fi
        fi
        if [[ "$LAST_MSG" == \[autofix\]* ]]; then
          echo "skip=true" >> "$GITHUB_OUTPUT"
          echo "Latest commit is [autofix]; skipping to avoid loop"
          exit 0
        fi

        # Native webhook identity, never relayed body text, grants reviewer admission.
        # Embedded in protected workflow source. All review content remains untrusted.
        review_admitted=false
        case "$EVENT_NAME" in
          issue_comment|pull_request_review|pull_request_review_comment)
            if [[ "${ACTOR_TYPE:-}" == Bot ]]; then
              if ! jq -e 'type == "array" and all(.[]; type == "string" and test("^[1-9][0-9]*$"))' <<< "$REVIEWER_IDS" >/dev/null 2>&1; then
                echo 'skip=true' >> "$GITHUB_OUTPUT"
                echo 'Approved reviewer ID configuration is invalid; editor admission held.'
                exit 0
              fi
              if jq -e --arg id "${ACTOR_ID:-}" 'index($id) != null' <<< "$REVIEWER_IDS" >/dev/null; then
                # Match the job-level inexpensive cue filter. Mixed findings/limit
                # banners remain eligible; an unchanged healthy notice is not progress.
                if [[ -z "${COMMENT_BODY//[[:space:]]/}" ]] ||
                   grep -qi 'auto-generated reply by CodeRabbit' <<< "$COMMENT_BODY" ||
                   { ! grep -Eqi "$REVIEW_FINDING_PATTERN" <<< "$COMMENT_BODY" &&
                     grep -Eqi "$REVIEW_INFORMATIONAL_PATTERN" <<< "$COMMENT_BODY"; }; then
                  echo 'skip=true' >> "$GITHUB_OUTPUT"
                  echo 'Informational reviewer event; no editor admitted.'
                  exit 0
                fi
                if [[ -n "${REVIEW_SOURCE_HEAD:-}" ]]; then
                  if [[ ! "$REVIEW_SOURCE_HEAD" =~ ^[0-9a-f]{40}$ || "$HEAD_SHA" != "$REVIEW_SOURCE_HEAD" ||
                        ( -n "${ADMITTED_REVIEW_HEAD:-}" && "$ADMITTED_REVIEW_HEAD" != "$REVIEW_SOURCE_HEAD" ) ]]; then
                    echo 'skip=true' >> "$GITHUB_OUTPUT"
                    echo 'Review head is stale or unreadable; original GitHub facts remain pending.'
                    exit 0
                  fi
                fi
                review_admitted=true
              fi
            fi
            ;;
        esac

        if [[ "$review_admitted" != true ]] && echo "$COMMENT_BODY" | grep -qi "skip-autofix"; then
          echo "skip=true" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        # Human issue_comment needs @claude. Verified native reviews, legacy relay
        # compatibility events and CI failures use their own admission routes.
        if [[ "$EVENT_NAME" == "issue_comment" ]]; then
          if [[ "$review_admitted" == true ]] || { [[ "$ACTOR" == "github-actions[bot]" ]] && [[ "$COMMENT_BODY" == '**[@'* ]]; }; then
            : # relayed bot review — proceed
          elif ! echo "$COMMENT_BODY" | grep -qi "@claude"; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
        fi

        if [[ "$EVENT_NAME" == "pull_request_review" ]]; then
          if [[ "$REVIEW_STATE" == "approved" ]] && [[ -z "$COMMENT_BODY" || "$COMMENT_BODY" == "null" ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
        fi

        # Opt-in trusted agent bots (e.g. Devin, Codex cloud, Cursor
        # background agents) whose pushes may trigger Autofix when CI fails.
        # Only on the workflow_run path, only for [bot] actors, matched like
        # the action's allowed_bots (case-insensitive, [bot] optional); '*'
        # is never honoured. Fork heads were already refused above.
        # The action's allowed_bots receives only this sanitised list, so a
        # '*' or malformed entry can never widen it either.
        trusted_bots() {
          local entry
          IFS=',' read -ra entries <<< "${TRUSTED_BOTS:-}"
          for entry in "${entries[@]}"; do
            entry="${entry#"${entry%%[![:space:]]*}"}"
            entry="${entry%"${entry##*[![:space:]]}"}"
            entry="${entry,,}"
            entry="${entry%\[bot\]}"
            if [[ "$entry" =~ ^[a-z0-9][a-z0-9-]*$ ]]; then echo "$entry"; fi
          done
        }
        trusted_bot() {
          local who="${1,,}" entry
          who="${who%\[bot\]}"
          for entry in $(trusted_bots); do
            [[ "$entry" == "$who" ]] && return 0
          done
          return 1
        }
        # CI push bots remain opt-in. Authenticated direct reviewer events use
        # their own immutable-ID policy; they do not widen the CI actor policy.
        allowed_bots="github-actions"
        if [[ "$review_admitted" == true ]]; then
          reviewer_login="${ACTOR,,}"
          if [[ ! "$reviewer_login" =~ ^[a-z0-9][a-z0-9-]*(\[bot\])?$ ]]; then echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          allowed_bots+=",${reviewer_login%\[bot\]}"
        fi
        if [[ "$EVENT_NAME" == "workflow_run" ]]; then
          for entry in $(trusted_bots); do allowed_bots+=",$entry"; done
        fi
        echo "allowed_bots=$allowed_bots" >> "$GITHUB_OUTPUT"

        # claude-code-action fails the job (rather than skipping) for bot
        # actors outside allowed_bots and for actors without write access.
        # Native review admission, the relay compatibility route and opted-in CI
        # bots are distinct. All other actors need native repository write access.
        event_authorized=false
        for who in "$ACTOR" "${WR_ACTOR:-}"; do
          [[ -z "$who" ]] && continue
          if [[ "$review_admitted" == true && "$who" == "$ACTOR" && "$EVENT_NAME" != workflow_run ]]; then continue; fi
          if [[ "$who" == "github-actions[bot]" && "$EVENT_NAME" == "issue_comment" && "$COMMENT_BODY" == '**[@'* ]]; then
            continue
          fi
          if [[ "$EVENT_NAME" == "workflow_run" && "$who" == *"[bot]" ]] && trusted_bot "$who"; then
            continue
          fi
          PERM=$(timeout -k 5 30 gh api "repos/${REPOSITORY}/collaborators/${who}/permission" --jq '.permission' 2>/dev/null || echo unknown)
          case "$PERM" in
            admin|write) event_authorized=true ;;
            *)
              echo "skip=true" >> "$GITHUB_OUTPUT"
              echo "Actor ${who} has no write access or is not an approved source (permission=${PERM}); skipping"
              exit 0
              ;;
          esac
        done

        # Bot identity authorizes delivery, not privileged execution for an arbitrary
        # PR opener. When all event actors used bot waivers, require native write
        # authority for the opener before any secret-bearing model action can run.
        # An existing writable human actor still authorizes its normal event route.
        if [[ "$event_authorized" != true ]]; then
          OPENER=$(jq -r '.opener // empty' <<< "$PR_HEAD")
          if [[ ! "$OPENER" =~ ^[a-zA-Z0-9][a-zA-Z0-9-]*(\[bot\])?$ ]]; then
            echo 'skip=true' >> "$GITHUB_OUTPUT"
            echo 'Native PR opener is missing or invalid; bot-driven editor admission held.'
            exit 0
          fi
          OPENER_PERM=$(timeout -k 5 30 gh api "repos/${REPOSITORY}/collaborators/${OPENER}/permission" --jq '.permission' 2>/dev/null || echo unknown)
          case "$OPENER_PERM" in
            admin|write) ;;
            *)
              echo 'skip=true' >> "$GITHUB_OUTPUT"
              echo 'Native PR opener lacks verified write authority; bot-driven editor admission held. Its existing authorized owner must reconcile the PR/read route; no model or writer identity fallback.'
              exit 0
              ;;
          esac
        fi

        # --repo required: this step runs with no checkout, so gh would
        # resolve the repo from cwd and fail. Failure must fail closed —
        # a label list we can't read might contain skip-ai-review.
        LABELS=$(timeout 20 gh pr view "$PR_NUM" --repo "${REPOSITORY}" --json labels --jq '[.labels[].name]' 2>/dev/null || echo 'FAIL')
        if [[ "$LABELS" == "FAIL" ]] || echo "$LABELS" | grep -q "skip-ai-review"; then
          echo "skip=true" >> "$GITHUB_OUTPUT"
        else
          echo "skip=false" >> "$GITHUB_OUTPUT"
        fi
        # autofix-control:event:end
    - name: Check retained execution owner
      id: custody
      if: steps.ref.outputs.skip != 'true' && steps.pr.outputs.skip != 'true'
      env:
        REPOSITORY: ${{ github.repository }}
        PR_NUMBER: ${{ steps.ref.outputs.pr_number }}
        EXPECTED_HEAD: ${{ steps.pr.outputs.head_sha }}
        GH_TOKEN: ${{ github.token }}
      run: |
        # autofix-control:guard:begin
        #!/usr/bin/env bash
        # Embedded into the trusted workflow by sync-autofix-control.py. Never source a PR copy.
        set -euo pipefail
        autofix_custody() {
          local pr author page comments count
          [[ "${PR_NUMBER:-}" =~ ^[1-9][0-9]*$ && "${EXPECTED_HEAD:-}" =~ ^[0-9a-f]{40}$ ]] || return 1
          if ! pr=$(timeout -k 5 30 gh api "repos/${REPOSITORY}/pulls/${PR_NUMBER}" 2>/dev/null); then
            echo 'Ownership readback unavailable; no editor or publication admitted.'
            return 1
          fi
          if ! jq -e --arg repo "$REPOSITORY" --arg head "$EXPECTED_HEAD" '
            .state == "open" and .head.sha == $head and
            (.head.repo.full_name | ascii_downcase) == ($repo | ascii_downcase) and
            (.user.id | type) == "number" and
            ([.labels[].name] | any(. == "skip-ai-review" or . == "human-merge" or . == "security-remediation") | not)
          ' <<< "$pr" >/dev/null; then
            echo 'Native PR state, head, fork or human hold prevents admission.'
            return 1
          fi
          if jq -e '(.body // "") | gsub("(?s)```.*?```"; "") | test("(?m)^X-Follow-Through-Owner:")' <<< "$pr" >/dev/null; then
            echo 'Existing session owner retained. No editor or publication admitted; GitHub facts remain with that owner.'
            return 1
          fi
          author=$(jq -r '.user.id' <<< "$pr")
          for page in 1 2 3 4 5; do
            if ! comments=$(timeout -k 5 30 gh api "repos/${REPOSITORY}/issues/${PR_NUMBER}/comments?per_page=100&page=${page}" 2>/dev/null) ||
               ! jq -e 'type == "array"' <<< "$comments" >/dev/null; then
              echo 'Owner registration readback incomplete; admission held.'
              return 1
            fi
            if jq -e --argjson author "$author" 'any(.[];
              (.user.id == $author or .user.id == 41898282) and
              ((.body // "") | startswith("<!-- follow-through-owner:v1 -->")))' <<< "$comments" >/dev/null; then
              echo 'Existing session owner retained by its registration. No editor or publication admitted.'
              return 1
            fi
            if jq -e --arg head "$EXPECTED_HEAD" 'any(.[];
              .user.id == 41898282 and ((.body // "") | test(
                "^<!-- pack-autofix-publication:v1 head=" + $head +
                " outcome=(protected_head_held|head_protection_unverified|publication_packet_held|publication_admission_held|native_state_held|instruction_surface_held|publication_credential_unavailable|publication_unknown|native_state_unverified|commit_subject_held|candidate_ancestry_held) -->")))' <<< "$comments" >/dev/null; then
              echo 'This head has held or uncertain publication. Its existing owner must recover retained work and resolve that dependency; new GitHub facts remain pending. No duplicate editor admitted.'
              return 1
            fi
            count=$(jq 'length' <<< "$comments")
            [[ "$count" -lt 100 ]] && return 0
          done
          echo 'Owner registration pagination bound reached; admission held.'
          return 1
        }
        if autofix_custody; then
          echo 'skip=false' >> "$GITHUB_OUTPUT"
        else
          echo 'skip=true' >> "$GITHUB_OUTPUT"
        fi
        # autofix-control:guard:end
    - name: Enforce per-PR successful-fix budget
      id: budget
      if: steps.ref.outputs.skip != 'true' && steps.pr.outputs.skip != 'true' && steps.custody.outputs.skip == 'false'
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        PR_NUM: ${{ steps.pr.outputs.number }}
        MAX_FIXES: '1'
        REPOSITORY: ${{ github.repository }}
      run: |
        set -euo pipefail
        MAX_FIXES="${MAX_FIXES:-1}"
        if [[ ! "$MAX_FIXES" =~ ^[0-9]+$ ]]; then echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0; fi
        # Count commits on this PR whose subject starts with [autofix]
        if ! COUNT=$(timeout -k 5 30 gh api "repos/${REPOSITORY}/pulls/${PR_NUM}/commits" --paginate \
          --jq '[.[].commit.message | split("\n")[0] | select(startswith("[autofix]"))] | length' 2>/dev/null \
          | awk '{s+=$1} END {print s+0}'); then
          echo "skip=true" >> "$GITHUB_OUTPUT"
          echo "::notice::Commit enumeration failed/timed out — budget unverifiable; skipping"
          exit 0
        fi
        echo "successful_fix_commits=$COUNT" >> "$GITHUB_OUTPUT"
        if [[ "$COUNT" -ge "$MAX_FIXES" ]]; then
          echo "skip=true" >> "$GITHUB_OUTPUT"
          echo "::notice::Per-PR autofix budget reached ($COUNT >= $MAX_FIXES successful [autofix] commits); skipping"
          # autofix-control:budget-notice:begin
          #!/usr/bin/env bash
          # One material budget receipt; repeated exhausted-budget wakes stay quiet.
          notice=unknown
          for page in 1 2 3 4 5; do
            if ! comments=$(timeout -k 5 30 gh api "repos/${REPOSITORY}/issues/${PR_NUM}/comments?per_page=100&page=${page}" 2>/dev/null); then break; fi
            if ! jq -e 'type == "array"' <<< "$comments" >/dev/null; then break; fi
            if jq -e 'any(.[]; .user.id == 41898282 and ((.body // "") | startswith("<!-- pack-autofix:budget-exhausted -->")))' <<< "$comments" >/dev/null; then
              notice=seen; break
            fi
            if [[ $(jq 'length' <<< "$comments") -lt 100 ]]; then notice=absent; break; fi
          done
          if [[ "$notice" == absent ]]; then
            timeout -k 5 30 gh pr comment "$PR_NUM" --repo "$REPOSITORY" --body "<!-- pack-autofix:budget-exhausted --> Autofix reached its configured successful-fix budget (${COUNT}/${MAX_FIXES}). The original owner retains unfinished commitments. Do not remove commits, reset counters or switch owners to evade this budget." || true
          fi
          # autofix-control:budget-notice:end
        else
          echo "skip=false" >> "$GITHUB_OUTPUT"
        fi
    - name: Gate — combine skip decisions
      id: gate
      env:
        REF_SKIP: ${{ steps.ref.outputs.skip }}
        PR_SKIP: ${{ steps.pr.outputs.skip }}
        CUSTODY_SKIP: ${{ steps.custody.outputs.skip }}
        BUDGET_SKIP: ${{ steps.budget.outputs.skip }}
      run: |
        set -euo pipefail
        if [[ "$CUSTODY_SKIP" == "true" || "$REF_SKIP" == "true" || "$PR_SKIP" == "true" || "$BUDGET_SKIP" == "true" ]]; then
          echo "skip=true" >> "$GITHUB_OUTPUT"
        else
          echo "skip=false" >> "$GITHUB_OUTPUT"
        fi
  autofix:
    name: Autofix PR
    needs: preflight
    if: needs.preflight.outputs.skip != 'true'
    concurrency:
      group: autofix-${{ github.repository }}-${{ needs.preflight.outputs.pr_number }}
      cancel-in-progress: false
    uses: $/.github/workflows/pr-autofix-execution-reusable.yml
    with:
      variant: standalone
      skip: ${{ needs.preflight.outputs.skip }}
      pr_number: ${{ needs.preflight.outputs.pr_number }}
      head_ref: ${{ needs.preflight.outputs.head_ref }}
      head_sha: ${{ needs.preflight.outputs.head_sha }}
      trigger_workflow: ${{ needs.preflight.outputs.trigger_workflow }}
      trigger_run_url: ${{ needs.preflight.outputs.trigger_run_url }}
      allowed_bots: ${{ needs.preflight.outputs.allowed_bots }}
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      LITELLM_MASTER_KEY: ${{ secrets.LITELLM_MASTER_KEY }}
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      MN_GH_AUTOMATION_TOKEN: ${{ secrets.MN_GH_AUTOMATION_TOKEN }}
