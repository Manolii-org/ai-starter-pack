# Cut a release tag via workflow_dispatch.
# Exists because sandboxed web sessions cannot push tag refs (git wire and
# REST tag writes are proxy-blocked); this lets any authorised operator or
# agent cut a version tag through Actions instead. Uses no third-party
# actions, so there is nothing to SHA-pin.
name: Release tag

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag name (vX.Y.Z)"
        required: true
      sha:
        description: "Commit SHA to tag (defaults to main HEAD)"
        required: false
        default: ""

permissions:
  checks: write
  contents: write

jobs:
  tag:
    concurrency:
      group: release-tag-${{ inputs.tag }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate tag format
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Refusing tag '$TAG' — must match vX.Y.Z" >&2
            exit 1
          fi
      - name: Create tag ref
        id: create
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
          SHA: ${{ inputs.sha }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ -z "$SHA" ]; then
            SHA=$(curl -sf --max-time 30 -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$REPO/commits/main" | python3 -c "import json,sys; print(json.load(sys.stdin)['sha'])")
          fi
          # Validate the FINAL sha (supplied or resolved) as a full commit hash
          # and serialise the payload — never interpolate into JSON.
          if ! printf '%s' "$SHA" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "Refusing sha '$SHA' — must be a full 40-char lowercase hex commit hash" >&2
            exit 1
          fi
          # ANNOTATED, not lightweight. `README.md` and master's CLAUDE.md both
          # describe pack releases as annotated tags, and v1.7.0–v1.7.3 are —
          # but v1.7.4, the first cut by this workflow, is a bare commit ref
          # because creating only refs/tags/X yields a lightweight tag. That
          # silently broke the stated convention. Creating the tag OBJECT first
          # and pointing the ref at it restores it.
          echo "Creating annotated tag object for $SHA as $TAG"
          TAG_PAYLOAD=$(TAG="$TAG" SHA="$SHA" python3 -c "import json,os; print(json.dumps({'tag': os.environ['TAG'], 'message': 'Release ' + os.environ['TAG'], 'object': os.environ['SHA'], 'type': 'commit'}))")
          TAG_SHA=$(curl -sf --max-time 30 -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/json" \
            "https://api.github.com/repos/$REPO/git/tags" \
            -d "$TAG_PAYLOAD" | python3 -c "import json,sys; print(json.load(sys.stdin)['sha'])")

          if ! printf '%s' "$TAG_SHA" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "Tag object creation did not return a sha — refusing to create the ref" >&2
            exit 1
          fi

          # Point the ref at the TAG OBJECT, not the commit.
          PAYLOAD=$(TAG="$TAG" SHA="$TAG_SHA" python3 -c "import json,os; print(json.dumps({'ref': 'refs/tags/' + os.environ['TAG'], 'sha': os.environ['SHA']}))")
          echo "Tagging $SHA as $TAG (annotated, tag object $TAG_SHA)"
          curl -sf --max-time 30 -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/json" \
            "https://api.github.com/repos/$REPO/git/refs" \
            -d "$PAYLOAD"
          # Published so the alias step reuses the sha resolved HERE. Re-reading
          # /commits/$TAG there would race tag-ref replication and 404.
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      # REUSABLE-WORKFLOWS.md documents `v1` as a MOVING major alias that
      # Renovate tracks, and pr-assessment-reusable.yml defaults its hydration
      # `pack_ref` to it — but nothing ever moved it, so `v1` sat on v1.7.2
      # while releases ran ahead to v1.8.0. Consumers extending the alias
      # silently got stale content. Move it here so the documented contract is
      # the enforced one.
      - name: Move major-version alias
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
          SHA: ${{ steps.create.outputs.sha }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          MAJOR="${TAG%%.*}"          # v1.9.0 -> v1
          # inputs.sha is empty when the caller defaulted to main HEAD, so take
          # the sha the create step actually tagged.
          if ! printf '%s' "$SHA" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "Create step published no usable sha — leaving $MAJOR unmoved" >&2
            exit 1
          fi
          # Lightweight on purpose: a moving alias cannot be an annotated tag
          # object, and this matches how upstream actions publish @v<major>.
          PAYLOAD=$(SHA="$SHA" python3 -c "import json,os; print(json.dumps({'sha': os.environ['SHA'], 'force': True}))")
          # PATCH updates an existing alias; a first-ever major needs POST.
          if curl -sf --max-time 30 -X PATCH \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "Content-Type: application/json" \
              "https://api.github.com/repos/$REPO/git/refs/tags/$MAJOR" \
              -d "$PAYLOAD" >/dev/null; then
            echo "Moved $MAJOR -> $SHA"
          else
            CREATE=$(MAJOR="$MAJOR" SHA="$SHA" python3 -c "import json,os; print(json.dumps({'ref': 'refs/tags/' + os.environ['MAJOR'], 'sha': os.environ['SHA']}))")
            curl -sf --max-time 30 -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "Content-Type: application/json" \
              "https://api.github.com/repos/$REPO/git/refs" \
              -d "$CREATE"
            echo "Created $MAJOR -> $SHA"
          fi


  outcome:
    name: release tag — explicit outcome
    needs: tag
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Publish release-tag outcome check
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          TAG_RESULT: ${{ needs.tag.result }}
        with:
          script: |
            const outcome = process.env.TAG_RESULT === 'success' ? 'EXECUTED' : 'FAILED';
            const summary = `${outcome}: release-tag operation ${process.env.TAG_RESULT}.`;
            await github.rest.checks.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              head_sha: context.sha,
              name: `release tag — ${outcome}`,
              status: 'completed',
              conclusion: outcome === 'FAILED' ? 'failure' : 'success',
              output: { title: `Release tag: ${outcome}`, summary },
              request: { timeout: 20000 },
            });
            if (outcome === 'FAILED') core.setFailed(summary);
