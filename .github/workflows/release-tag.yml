# Cut a release tag via workflow_dispatch.
# Exists because sandboxed web sessions cannot push tag refs (git wire and
# REST tag writes are proxy-blocked); this lets any authorised operator or
# agent cut a version tag through Actions instead. Uses no third-party
# actions, so there is nothing to SHA-pin.
name: Release tag

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag name: pack release vX.Y.Z, or component email-capture-vX.Y.Z / feature-controls-vX.Y.Z[-alpha|beta|rc.N]"
        required: true
      sha:
        description: "Commit SHA to tag (defaults to main HEAD)"
        required: false
        default: ""
      notes:
        description: "Annotated tag message (defaults to 'Release <tag>')"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  tag:
    concurrency:
      group: release-tag-${{ inputs.tag }}
      cancel-in-progress: false
    runs-on: ${{ fromJSON(vars.LIGHT_RUNNER || '["ubuntu-slim"]') }}
    timeout-minutes: 5
    outputs:
      tagged_sha: ${{ steps.create.outputs.sha }}
    steps:
      - name: Validate tag format
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          # Pack releases are bare vX.Y.Z. Components release under their own
          # prefixed namespace so a component version can never be mistaken
          # for (or sort among) pack releases; bare v0.x tags are legacy.
          # Whole-string bash regex: grep matches per line, so a multi-line
          # input would pass a grep check on its first line.
          PACK_RE='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          COMPONENT_RE='^(email-capture|feature-controls)-v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-(alpha|beta|rc)\.(0|[1-9][0-9]*))?$'
          if [[ "$TAG" =~ $PACK_RE ]]; then
            echo "Pack release tag $TAG"
          elif [[ "$TAG" =~ $COMPONENT_RE ]]; then
            echo "Component release tag $TAG (major alias is never moved)"
          else
            echo "Refusing tag '$TAG' — must match vX.Y.Z or <component>-vX.Y.Z" >&2
            exit 1
          fi
      - name: Create tag ref
        id: create
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
          SHA: ${{ inputs.sha }}
          NOTES: ${{ inputs.notes }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ -z "$SHA" ]; then
            # Bearer token via stdin (-H @-), never argv — argv is world-readable in ps.
            SHA=$(printf 'Authorization: Bearer %s\n' "$GH_TOKEN" | curl -sf --max-time 30 -H @- \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$REPO/commits/main" | python3 -c "import json,sys; print(json.load(sys.stdin)['sha'])")
          fi
          # Validate the FINAL sha (supplied or resolved) as a full commit hash
          # and serialise the payload — never interpolate into JSON.
          if ! printf '%s' "$SHA" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "Refusing sha '$SHA' — must be a full 40-char lowercase hex commit hash" >&2
            exit 1
          fi
          # ANNOTATED, not lightweight. `README.md` and master's CLAUDE.md both
          # describe pack releases as annotated tags, and v1.7.0–v1.7.3 are —
          # but v1.7.4, the first cut by this workflow, is a bare commit ref
          # because creating only refs/tags/X yields a lightweight tag. That
          # silently broke the stated convention. Creating the tag OBJECT first
          # and pointing the ref at it restores it.
          echo "Creating annotated tag object for $SHA as $TAG"
          TAG_PAYLOAD=$(TAG="$TAG" SHA="$SHA" NOTES="$NOTES" python3 -c "import json,os; print(json.dumps({'tag': os.environ['TAG'], 'message': os.environ['NOTES'] or 'Release ' + os.environ['TAG'], 'object': os.environ['SHA'], 'type': 'commit'}))")
          TAG_SHA=$(printf 'Authorization: Bearer %s\n' "$GH_TOKEN" | curl -sf --max-time 30 -X POST \
            -H @- \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/json" \
            "https://api.github.com/repos/$REPO/git/tags" \
            -d "$TAG_PAYLOAD" | python3 -c "import json,sys; print(json.load(sys.stdin)['sha'])")

          if ! printf '%s' "$TAG_SHA" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "Tag object creation did not return a sha — refusing to create the ref" >&2
            exit 1
          fi

          # Point the ref at the TAG OBJECT, not the commit.
          PAYLOAD=$(TAG="$TAG" SHA="$TAG_SHA" python3 -c "import json,os; print(json.dumps({'ref': 'refs/tags/' + os.environ['TAG'], 'sha': os.environ['SHA']}))")
          echo "Tagging $SHA as $TAG (annotated, tag object $TAG_SHA)"
          printf 'Authorization: Bearer %s\n' "$GH_TOKEN" | curl -sf --max-time 30 -X POST \
            -H @- \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/json" \
            "https://api.github.com/repos/$REPO/git/refs" \
            -d "$PAYLOAD"
          # Published so the alias step reuses the sha resolved HERE. Re-reading
          # /commits/$TAG there would race tag-ref replication and 404.
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      # v2 is the moving major alias for the pack_ref contract that follows
      # job.workflow_sha. v1 stays frozen on its last v1 release.
      - name: Move major-version alias
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
          SHA: ${{ steps.create.outputs.sha }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Pack releases only: a component tag (email-capture-v*,
          # feature-controls-v*) must never move the pack's major alias.
          PACK_RE='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          if [[ "$TAG" =~ $PACK_RE ]]; then
            MAJOR="${TAG%%.*}"          # v2.0.0 -> v2
            if [[ "$MAJOR" == "v1" ]]; then
              echo "v1 is frozen; this workflow does not move it"
              exit 0
            fi
            # inputs.sha is empty when the caller defaulted to main HEAD, so take
            # the sha the create step actually tagged.
            if ! printf '%s' "$SHA" | grep -Eq '^[0-9a-f]{40}$'; then
              echo "Create step published no usable sha — leaving $MAJOR unmoved" >&2
              exit 1
            fi
            # Lightweight on purpose: a moving alias cannot be an annotated tag
            # object, and this matches how upstream actions publish @v<major>.
            PAYLOAD=$(SHA="$SHA" python3 -c "import json,os; print(json.dumps({'sha': os.environ['SHA'], 'force': True}))")
            # PATCH updates an existing alias; a first-ever major needs POST.
            if printf 'Authorization: Bearer %s\n' "$GH_TOKEN" | curl -sf --max-time 30 -X PATCH \
                -H @- \
                -H "Accept: application/vnd.github+json" \
                -H "Content-Type: application/json" \
                "https://api.github.com/repos/$REPO/git/refs/tags/$MAJOR" \
                -d "$PAYLOAD" >/dev/null; then
              echo "Moved $MAJOR -> $SHA"
            else
              CREATE=$(MAJOR="$MAJOR" SHA="$SHA" python3 -c "import json,os; print(json.dumps({'ref': 'refs/tags/' + os.environ['MAJOR'], 'sha': os.environ['SHA']}))")
              printf 'Authorization: Bearer %s\n' "$GH_TOKEN" | curl -sf --max-time 30 -X POST \
                -H @- \
                -H "Accept: application/vnd.github+json" \
                -H "Content-Type: application/json" \
                "https://api.github.com/repos/$REPO/git/refs" \
                -d "$CREATE"
              echo "Created $MAJOR -> $SHA"
            fi
          else
            echo "Component tag $TAG: the major alias belongs to pack releases and is left unmoved"
          fi

  security-diff:
    # Reviewer aid for consumers' grouped Renovate PR: what changed in
    # triggers, permissions, secrets, external uses, event expressions in run:
    # and hosts since the previous pack release. Report only — never blocks.
    name: release security diff
    needs: tag
    if: ${{ needs.tag.result == 'success' && startsWith(inputs.tag, 'v') }}
    runs-on: ${{ fromJSON(vars.LIGHT_RUNNER || '["ubuntu-slim"]') }}
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ needs.tag.outputs.tagged_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: '3.12'
      - name: Diff against previous pack release
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          python3 -m pip install --quiet --disable-pip-version-check --require-hashes --only-binary=:all: -r config/workflow-security-requirements.txt
          git fetch --quiet --tags origin
          # No grep filter: under pipefail an empty match (first release) would
          # abort the step. awk already keeps only versions strictly below TAG.
          PREV=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' | sort -V \
            | awk -v t="$TAG" 'BEGIN{split(substr(t,2),c,".")} {split(substr($0,2),p,"."); if (p[1]<c[1] || (p[1]==c[1] && (p[2]<c[2] || (p[2]==c[2] && p[3]<c[3])))) last=$0} END{print last}')
          if [ -z "$PREV" ]; then
            echo "No earlier pack release tag; nothing to diff" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          python3 scripts/release-security-diff.py --base "$PREV" --head HEAD \
            --summary "$GITHUB_STEP_SUMMARY" > /dev/null

  outcome:
    name: release tag — explicit outcome
    needs: tag
    if: ${{ always() }}
    runs-on: ${{ fromJSON(vars.LIGHT_RUNNER || '["ubuntu-slim"]') }}
    timeout-minutes: 5
    permissions:
      checks: write
      contents: read
    steps:
      - name: Publish release-tag outcome check
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          TAG_RESULT: ${{ needs.tag.result }}
          TAGGED_SHA: ${{ needs.tag.outputs.tagged_sha }}
        with:
          script: |
            const outcome = process.env.TAG_RESULT === 'success' ? 'EXECUTED' : 'FAILED';
            const summary = `${outcome}: release-tag operation ${process.env.TAG_RESULT}.`;
            const conclusions = { EXECUTED: 'success', FAILED: 'failure' };
            await github.rest.checks.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              head_sha: process.env.TAGGED_SHA || context.sha,
              name: `release tag — ${outcome}`,
              status: 'completed',
              conclusion: conclusions[outcome],
              output: { title: `Release tag: ${outcome}`, summary },
              request: { timeout: 20000 },
            });
            if (outcome === 'FAILED') core.setFailed(summary);
