name: Plugin Eval Gate

# Gates the generated Claude Code plugin: it must build from the canonical
# .claude/ source, pass structural verification, prove every hook FIRES, and the
# committed plugin/ artifact must match a fresh build (no stale checked-in copy).
# Pure Python + copier — no external CLI or secrets required.

on:
  push:
    branches: [main, "claude/**"]
    paths:
      - ".claude/**"
      - "scripts/**"
      - "plugin/**"
      - "plugin-sources/**"
      - "tests/**"
      - "copier.yml"
      - "pack.manifest.yml"
      - ".claude-plugin/**"
      - ".github/workflows/plugin-eval-gate.yml"
      # Scanned by test_no_withdrawn_tool_instructions.py. A guard that reads a
      # path but is not triggered by it is not a gate — see the SCAN_* coverage
      # check in that file, which fails if these drift apart again.
      - "docs/**"
      - "CLAUDE.md"
      - "AGENTS.md"
  pull_request:
    paths:
      - ".claude/**"
      - "scripts/**"
      - "plugin/**"
      - "plugin-sources/**"
      - "tests/**"
      - "copier.yml"
      - "pack.manifest.yml"
      - ".claude-plugin/**"
      - ".github/workflows/plugin-eval-gate.yml"
      - "docs/**"
      - "CLAUDE.md"
      - "AGENTS.md"

jobs:
  eval-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Copier's overwrite contract checks the recorded release tag. A shallow
          # checkout makes that local tag unavailable and turns the test into an
          # infrastructure failure rather than a template assertion.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build deps
        run: pip install --quiet copier jinja2

      - name: Build manolii-framework — verify() + hook-firing smoke test
        # build-plugin.py exits non-zero on: surviving Jinja, missing plugin.json,
        # a hooks.json command referencing a missing bundled file, hook-event drift
        # vs settings.json, an unbundled import-time dep, or any hook that fails to
        # fire / writes into the (read-only) plugin tree.
        run: python3 scripts/build-plugin.py --plugin manolii-framework --out /tmp/plugin-framework-fresh

      - name: Drift check — manolii-framework
        run: |
          if diff -r -x '__pycache__' -x '*.pyc' plugin/manolii-framework /tmp/plugin-framework-fresh; then
            echo "OK: committed plugin/manolii-framework matches a fresh build"
          else
            echo "FAIL: committed plugin/manolii-framework is stale — run 'python3 scripts/build-plugin.py --plugin manolii-framework' and commit the result"
            exit 1
          fi

      - name: Build manolii-om — verify()
        run: python3 scripts/build-plugin.py --plugin manolii-om --out /tmp/plugin-om-fresh

      - name: Drift check — manolii-om
        run: |
          if diff -r -x '__pycache__' -x '*.pyc' plugin/manolii-om /tmp/plugin-om-fresh; then
            echo "OK: committed plugin/manolii-om matches a fresh build"
          else
            echo "FAIL: committed plugin/manolii-om is stale — run 'python3 scripts/build-plugin.py --plugin manolii-om' and commit the result"
            exit 1
          fi


      - name: Install pytest
        run: python3 -m pip install --quiet pytest

      - name: Retrospective + memory path tests
        run: |
          python3 -m pytest scripts/tests/test_session_retrospective.py scripts/tests/test_failure_class.py -q
          bash scripts/tests/test_migrate_memory_path.sh
          bash scripts/tests/test_plugin_scripts_sync.sh
          # Codex P2 2026-07-19: the two hardening bash suites weren't
          # being invoked by the eval-gate — regressions in wrapper
          # payload/timeout handling or migrate safety could merge unseen.
          bash scripts/tests/migrate-memory-path.test.sh
          bash scripts/tests/session-stop-retrospective.test.sh

      - name: Copier template and repository tests
        # `tests/` is the consumer-rendering contract. Keep copier installed above:
        # without it, nine subprocess cases error before exercising the template.
        run: python3 -m pytest tests/ -q

      - name: Plugin hook + drift guards
        run: |
          # Codex P2 2026-08-22 (#71): these three guards were only documented for
          # manual execution — the explicit pytest list above did not include them,
          # so the cwd-probe behaviour, the withdrawn-tool scan and the declared
          # guard subset could all regress while CI stayed green. That is precisely
          # the drift they exist to detect.
          python3 scripts/tests/test_plugin_hook_cwd_probe.py
          python3 scripts/tests/test_no_withdrawn_tool_instructions.py
          python3 scripts/tests/test_hook_guard_coverage.py

      - name: Routing lint
        run: python3 scripts/lint-agent-routing.py
