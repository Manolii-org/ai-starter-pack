name: Native owning recipe

# Pack-local read-only qualification. No deployment or approval authority.
on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

concurrency:
  group: native-owner-recipe-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  owner_recipe:
    if: github.repository == 'Manolii-org/ai-starter-pack'
    name: Owning agent-check recipe
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Classify the immutable event before expensive work
        id: classify
        run: python3 scripts/ci/native_owner_recipe.py --plan --output "$RUNNER_TEMP/native-owner-recipe.json"
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        if: success() && steps.classify.outcome == 'success' && steps.classify.outputs.selected == 'true'
        with:
          node-version: '24.22.2'
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        if: success() && steps.classify.outcome == 'success' && steps.classify.outputs.selected == 'true'
        with:
          version: '0.13.7'
          enable-cache: false
      - name: Install public test prerequisites for plain Python recipe commands
        if: success() && steps.classify.outcome == 'success' && steps.classify.outputs.selected == 'true'
        timeout-minutes: 5
        run: python3 -m pip install 'pytest==9.2.0' 'pyyaml==6.0.3' 'jsonschema==4.25.1' 'pydantic>=2,<3'
      - name: Install signed public Linux executor prerequisites
        if: success() && steps.classify.outcome == 'success' && steps.classify.outputs.selected == 'true' && hashFiles('scripts/lib/source_executor.py') != ''
        shell: bash
        run: |
          set -euo pipefail
          sudo -n apt-get update
          bubblewrap_version="$(apt-cache policy bubblewrap | awk '/Candidate:/ && !seen {print $2; seen=1}')"
          build_version="$(apt-cache policy build-essential | awk '/Candidate:/ && !seen {print $2; seen=1}')"
          for version in "$bubblewrap_version" "$build_version"; do
            if [ -z "$version" ] || [ "$version" = '(none)' ]; then
              echo 'INCOMPLETE: signed public prerequisite candidate unavailable' >&2
              exit 2
            fi
          done
          sudo -n apt-get install --no-install-recommends -y "bubblewrap=$bubblewrap_version" "build-essential=$build_version"
          dpkg-query --show bubblewrap build-essential
      - name: Execute the unchanged owning recipe
        if: success() && steps.classify.outcome == 'success' && steps.classify.outputs.selected == 'true'
        run: python3 scripts/ci/native_owner_recipe.py --output "$RUNNER_TEMP/native-owner-recipe.json"
      - name: Retain only the non-authorizing public execution summary
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-owner-recipe-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/native-owner-recipe.json
          if-no-files-found: error
          retention-days: 7
