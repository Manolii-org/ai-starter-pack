name: Secret Scan (Reusable)
# Reusable workflow_call form. Caller owns on: + paths-ignore via top-level.
# Cite: .github/workflows/REUSABLE-WORKFLOWS.md
#
# Scans for accidentally committed secrets using Gitleaks.
# Private / org-owned repos: prefer the free OSS binary path when
# GITLEAKS_LICENSE is unset. gitleaks-action requires a license on
# non-public repos (breaking change) — do not force that on consumers.

on:
  workflow_call:
    inputs:
      runs_on:
        type: string
        default: ubuntu-latest
        description: Runner label.
      node_version:
        type: string
        default: '22'
        description: Node.js version for npm audit.
      python_version:
        type: string
        default: '3.12'
        description: Python version for pip-audit.
      require_gitleaks_license:
        type: boolean
        default: false
        description: Fail loudly if GITLEAKS_LICENSE empty (forces action path).
      npm_audit_omit_dev:
        type: boolean
        default: false
        description: 'Opt in to auditing production deps only (`--omit=dev` on npm >= 7, `--only=prod` on npm 6). Use when unfixable dev-only advisories (e.g. eslint/tooling chains) would otherwise block every PR forever. Default stays false — auditing the whole tree is the v1 contract (REUSABLE-WORKFLOWS.md: default-change requires v2).'
      gitleaks_version:
        type: string
        default: '8.30.0'
        description: Pinned OSS gitleaks binary version when license is absent.
    secrets:
      GITLEAKS_LICENSE:
        required: false
        description: Gitleaks license (paid plan / private repos using gitleaks-action).

permissions:
  contents: read


jobs:
  gitleaks:
    name: Detect Secrets
    runs-on: ${{ inputs.runs_on }}
    timeout-minutes: 10
    # `secrets` is not available in step-level `if:` expressions. Promote the
    # optional value once at job scope, then branch through the allowed `env`
    # context without printing it.
    env:
      GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
          fetch-depth: 0
          submodules: false

      - name: Validate license requirement
        if: ${{ inputs.require_gitleaks_license }}
        shell: bash
        run: |
          if [[ -z "$GITLEAKS_LICENSE" ]]; then
            echo "::error::require_gitleaks_license=true but GITLEAKS_LICENSE is empty"; exit 1
          fi

      - name: Run Gitleaks (licensed action)
        if: ${{ env.GITLEAKS_LICENSE != '' }}
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install gitleaks (OSS binary fallback)
        if: ${{ env.GITLEAKS_LICENSE == '' }}
        env:
          VERSION: ${{ inputs.gitleaks_version }}
        shell: bash
        run: |
          set -euo pipefail
          curl -sSL --max-time 60 --connect-timeout 10 \
            "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" \
            -o gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          sudo install gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Run Gitleaks (OSS binary)
        if: ${{ env.GITLEAKS_LICENSE == '' }}
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          EXTRA=()
          if [[ -f .gitleaks.toml ]]; then EXTRA+=(--config .gitleaks.toml); fi
          if [[ "$EVENT_NAME" == "pull_request" && -n "${BASE_SHA:-}" && -n "${HEAD_SHA:-}" ]]; then
            echo "Diff-only scan: ${BASE_SHA}..${HEAD_SHA}"
            gitleaks detect --source . --verbose --redact \
              --log-opts="${BASE_SHA}..${HEAD_SHA}" "${EXTRA[@]+"${EXTRA[@]}"}"
          else
            gitleaks detect --source . --verbose --redact "${EXTRA[@]+"${EXTRA[@]}"}"
          fi

  npm-audit:
    name: Dependency Vulnerability Audit
    runs-on: ${{ inputs.runs_on }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
          submodules: false

      - name: Detect npm lockfile
        id: detect
        run: |
          if [ -f package-lock.json ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            if [ -f pnpm-lock.yaml ] || [ -f yarn.lock ]; then
              echo "::notice::Skipping npm audit — package-lock.json absent (pnpm/yarn repo). Use the package manager's own audit in app CI."
            fi
          fi

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        if: steps.detect.outputs.found == 'true'
        with:
          node-version: ${{ inputs.node_version }}

      - name: Install dependencies
        if: steps.detect.outputs.found == 'true'
        run: npm ci

      - name: Audit for high/critical vulnerabilities
        if: steps.detect.outputs.found == 'true'
        env:
          OMIT_DEV: ${{ inputs.npm_audit_omit_dev }}
        run: |
          set -euo pipefail
          FLAG=""
          if [[ "$OMIT_DEV" == "true" ]]; then
            # --omit=dev exists only on npm >= 7; npm 6's equivalent is --only=prod.
            NPM_MAJOR="$(npm --version | cut -d. -f1)"
            if [[ "$NPM_MAJOR" -ge 7 ]]; then
              FLAG="--omit=dev"
            else
              FLAG="--only=prod"
            fi
            echo "npm_audit_omit_dev: using $FLAG (npm $NPM_MAJOR.x)"
          fi
          npm audit --audit-level=high $FLAG

  pip-audit:
    name: Python Dependency Audit
    runs-on: ${{ inputs.runs_on }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
          submodules: false

      - name: Detect Python dependency manifests
        id: detect
        run: |
          if ls requirements*.txt >/dev/null 2>&1 || [ -f pyproject.toml ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        if: steps.detect.outputs.found == 'true'
        with:
          python-version: ${{ inputs.python_version }}

      - name: Install pip-audit
        if: steps.detect.outputs.found == 'true'
        run: python -m pip install --upgrade pip pip-audit

      - name: Audit Python dependencies
        if: steps.detect.outputs.found == 'true'
        run: |
          set -euo pipefail
          if ls requirements*.txt >/dev/null 2>&1; then
            for f in requirements*.txt; do
              pip-audit -r "$f"
            done
          elif [ -f uv.lock ]; then
            # A uv project commits no requirements*.txt; a bare `pip-audit` would
            # only see this job's own site-packages and can never go red. Export
            # the committed lockfile and audit that. --locked fails the job when
            # the lock is stale vs pyproject.toml (a silently-exported stale lock
            # would audit the wrong graph); --all-packages/--all-extras/--all-groups
            # cover workspaces, optional extras and non-default groups.
            if ! command -v uv >/dev/null 2>&1; then
              timeout 120 python -m pip install --quiet uv
            fi
            # --no-emit-workspace/--no-emit-project keep local editables out of
            # the export — pip-audit would invoke the project build backend on
            # `-e` entries. Mutually-conflicting extras/groups can't co-resolve
            # in one export, so on failure audit each selection separately:
            # base graph (incl. default groups), every optional extra, and each
            # non-default group with defaults disabled. Union coverage — never
            # silently reduced — and a failing export or audit still fails the
            # job. Selectors are enumerated from the root and every workspace
            # member (tomllib fallback covers the 3.10 python_version case).
            UV_EXPORT="uv export --locked --no-hashes --all-packages --no-emit-workspace --no-emit-project"
            if ! $UV_EXPORT --all-extras --all-groups \
              --output-file /tmp/pip-audit-requirements.txt; then
              python3 -c "import glob, importlib, os, sys; tomllib = importlib.import_module('tomllib' if sys.version_info >= (3, 11) else 'pip._vendor.tomli'); root = tomllib.load(open('pyproject.toml','rb')); ws = root.get('tool',{}).get('uv',{}).get('workspace'); pats = (ws or {}).get('members', ['*']) if ws else []; excl = (ws or {}).get('exclude', []) if ws else []; dirs = {'.'} | ({d for p in pats for d in glob.glob(p)} - {d for p in excl for d in glob.glob(p)}); loads = [tomllib.load(open(d.rstrip('/') + '/pyproject.toml','rb')) for d in dirs if os.path.exists(d.rstrip('/') + '/pyproject.toml')]; sels = {x for dd in loads for x in ['--extra ' + e for e in dd.get('project',{}).get('optional-dependencies',{})] + ['--group ' + g for g in dd.get('dependency-groups',{})]}; print('--only-base'); [print(s) for s in sorted(sels)]" > /tmp/uv-selections.txt
              while IFS= read -r sel; do
                case "$sel" in
                  --only-base) $UV_EXPORT --output-file /tmp/pip-audit-requirements.txt ;;
                  *) $UV_EXPORT --no-default-groups $sel --output-file /tmp/pip-audit-requirements.txt ;;
                esac
                pip-audit -r /tmp/pip-audit-requirements.txt
              done < /tmp/uv-selections.txt
            else
              pip-audit -r /tmp/pip-audit-requirements.txt
            fi
          elif [ -f pyproject.toml ]; then
            pip-audit
          fi
