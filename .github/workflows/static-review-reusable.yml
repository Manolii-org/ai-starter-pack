name: Static Review (Reusable)
# Reusable workflow_call form. Caller owns on: + paths-ignore via top-level.
# Cite: .github/workflows/REUSABLE-WORKFLOWS.md
#
# SAST on changed files only — Semgrep (all languages), Bandit (Python),
# Shellcheck (shell scripts), ESLint (JS/TS).

on:
  workflow_call:
    inputs:
      runs_on:
        type: string
        default: ubuntu-latest
        description: Runner label for all jobs.
      node_version:
        type: string
        default: '24'
        description: Node.js version.
      python_version:
        type: string
        default: '3.14'
        description: Python version.
      semgrep_runs_on:
        type: string
        default: ''
        description: >-
          Runner label for the Semgrep job. Empty follows runs_on. The job runs
          in Semgrep's own container image, so it needs a Docker-capable runner
          (ubuntu-latest or self-hosted with Docker; ubuntu-slim cannot run job
          containers).
      semgrep_config:
        type: string
        default: 'p/default p/secrets p/owasp-top-ten'
        description: >-
          Space-separated Semgrep configs (registry rulesets or repo paths).
          Registry rules are fetched at run time and never vendored.
      semgrep_local_rules:
        type: string
        default: ''
        description: >-
          Optional repo path of extra rule files (for example .semgrep/rules).
          Empty adds nothing, which matches the v1 behaviour.

permissions:
  contents: read


jobs:
  changed-files:
    name: Detect Changed Files
    runs-on: ${{ inputs.runs_on }}
    timeout-minutes: 5
    outputs:
      has_py: ${{ steps.detect.outputs.has_py }}
      has_sh: ${{ steps.detect.outputs.has_sh }}
      has_ts: ${{ steps.detect.outputs.has_ts }}
      has_sql: ${{ steps.detect.outputs.has_sql }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: detect
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          CHANGED=$(git diff --name-only "origin/${BASE_REF}...HEAD")
          echo "has_py=$(echo "$CHANGED" | grep -q '\.py$' && echo true || echo false)" >> $GITHUB_OUTPUT
          echo "has_sh=$(echo "$CHANGED" | grep -q '\.sh$' && echo true || echo false)" >> $GITHUB_OUTPUT
          echo "has_ts=$(echo "$CHANGED" | grep -qE '\.(ts|tsx|js|jsx)$' && echo true || echo false)" >> $GITHUB_OUTPUT
          echo "has_sql=$(echo "$CHANGED" | grep -q '\.sql$' && echo true || echo false)" >> $GITHUB_OUTPUT

  semgrep:
    name: Semgrep
    runs-on: ${{ inputs.semgrep_runs_on || inputs.runs_on }}
    timeout-minutes: 15
    needs: changed-files
    # returntocorp/semgrep-action was archived on 2024-04-09. Semgrep's own
    # image, pinned by digest, is the maintained path. Bump tag and digest
    # together (Renovate docker manager).
    container:
      image: semgrep/semgrep:1.184.0@sha256:cc1b68266f267878b39739373ea9985b9a78e5d64497dd875c8de100b22695ed
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Run Semgrep (PR and merge queue report only findings the change introduces)
        env:
          SEMGREP_CONFIG: ${{ inputs.semgrep_config }}
          SEMGREP_LOCAL_RULES: ${{ inputs.semgrep_local_rules }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          MQ_BASE_SHA: ${{ github.event.merge_group.base_sha }}
        shell: sh
        run: |
          # POSIX sh: the Semgrep image is not guaranteed to ship bash.
          set -eu
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          set -- scan --metrics=off --error --disable-version-check
          for c in $SEMGREP_CONFIG; do set -- "$@" --config "$c"; done
          if [ -n "$SEMGREP_LOCAL_RULES" ]; then
            if [ -e "$SEMGREP_LOCAL_RULES" ]; then
              set -- "$@" --config "$SEMGREP_LOCAL_RULES"
            else
              echo "::warning::semgrep_local_rules=$SEMGREP_LOCAL_RULES does not exist; ignoring"
            fi
          fi
          base="${PR_BASE_SHA:-${MQ_BASE_SHA:-}}"
          if [ -n "$base" ]; then
            echo "Reporting findings introduced since ${base}"
            set -- "$@" --baseline-commit "$base"
          else
            echo "No base commit for event; scanning the whole checkout"
          fi
          semgrep "$@"


  bandit:
    name: Bandit (Python)
    runs-on: ${{ inputs.runs_on }}
    timeout-minutes: 15
    needs: changed-files
    if: needs.changed-files.outputs.has_py == 'true'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: ${{ inputs.python_version }}
      - name: Install bandit
        run: pip install bandit[toml] -q
      - name: Run Bandit on changed Python files
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          CHANGED_PY=$(git diff --name-only "origin/${BASE_REF}...HEAD" | grep '\.py$' | head -50)
          if [ -n "$CHANGED_PY" ]; then
            bandit $CHANGED_PY -ll -ii || echo "::warning::Bandit found issues — review above"
          fi

  shellcheck:
    name: Shellcheck
    runs-on: ${{ inputs.runs_on }}
    timeout-minutes: 15
    needs: changed-files
    if: needs.changed-files.outputs.has_sh == 'true'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Run Shellcheck on changed shell files
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          # Deleted shell files must not be passed to shellcheck: the path no
          # longer exists in the checkout. Keep rename destinations and all
          # added/copied/modified files.
          CHANGED_SH=$(git diff --name-only --diff-filter=ACMR "origin/${BASE_REF}...HEAD" -- '*.sh')
          if [ -n "$CHANGED_SH" ]; then
            shellcheck --severity=warning $CHANGED_SH
          fi

  eslint:
    name: ESLint (JS/TS)
    runs-on: ${{ inputs.runs_on }}
    timeout-minutes: 15
    needs: changed-files
    if: needs.changed-files.outputs.has_ts == 'true'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Detect package.json
        id: detect
        run: |
          if [ -f package.json ]; then echo "found=true" >> "$GITHUB_OUTPUT"; else echo "found=false" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        if: steps.detect.outputs.found == 'true'
        with:
          node-version: ${{ inputs.node_version }}
      - name: Install dependencies
        if: steps.detect.outputs.found == 'true'
        run: npm ci
      - name: Run ESLint on changed files
        if: steps.detect.outputs.found == 'true'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          CHANGED_TS=$(git diff --name-only "origin/${BASE_REF}...HEAD" \
            | grep -E '\.(ts|tsx|js|jsx)$' | head -50)
          if [ -n "$CHANGED_TS" ]; then
            npx eslint $CHANGED_TS --max-warnings 0 || echo "::warning::ESLint found issues"
          fi

  agent-routing-lint:
    name: Agent Routing Lint
    runs-on: ${{ inputs.runs_on }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - name: Detect agent/skill docs
        id: detect
        run: |
          if find .claude/agents -maxdepth 1 -name '*.md' 2>/dev/null | grep -q . \
             || find .claude/skills -name '*.md' 2>/dev/null | grep -q .; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        if: steps.detect.outputs.found == 'true'
        with:
          python-version: ${{ inputs.python_version }}
      - name: Lint agent routing config
        if: steps.detect.outputs.found == 'true'
        run: python3 scripts/lint-agent-routing.py
      - name: Check retired anthropic_only tier references
        if: steps.detect.outputs.found == 'true'
        run: |
          # The caller repo may run a newer workflow before `copier update`
          # has shipped the checker — skip-with-notice, don't hard-fail.
          if [ -f scripts/check-no-anthropic-only.py ]; then
            python3 scripts/check-no-anthropic-only.py
          else
            echo "::notice::scripts/check-no-anthropic-only.py not present; skipping retired-tier check"
          fi
