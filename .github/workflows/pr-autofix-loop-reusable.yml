          EXPLICIT: ${{ inputs.model }}
          SOURCE: ${{ inputs.provider_mode }}
          KEY: ${{ env.ANTHROPIC_API_KEY }}
          BASE_URL: ${{ env.ANTHROPIC_BASE_URL }}
        run: |
          # Lean default per plane (ADR-0002). A proxy deployed from a template
          # older than v1.25.0 has no tier-2-agentic-pro alias, and asking for it
          # would fail the run, so it is used only when the proxy lists it.
          model="$EXPLICIT"
