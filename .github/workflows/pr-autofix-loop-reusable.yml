          if [ -z "$model" ]; then
            models=$(printf 'header = "Authorization: Bearer %s"\n' "$KEY" \
              | curl -fsS --max-time 20 -K - "${BASE_URL%/}/v1/models" 2>/dev/null || true)
            case "$models" in
              *'"tier-2-agentic-pro"'*) model=tier-2-agentic-pro ;;
              *) model=tier-2-agentic
                 echo "::notice::The proxy does not list tier-2-agentic-pro; Autofix uses tier-2-agentic. Redeploy the proxy from the v1.25.0+ template, or set a model, to use MiniMax M3." ;;
            esac
