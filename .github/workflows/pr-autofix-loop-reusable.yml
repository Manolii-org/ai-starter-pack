# Trusted control source: generated payloads are checked by scripts/sync-autofix-control.py.
name: PR Autofix Loop (Reusable)
on:
  workflow_call:
    inputs:
      provider_mode:
        type: string
        default: proxy
        description: proxy (governed router) | anthropic (explicit external direct opt-in)
      litellm_proxy_url:
        type: string
        default: ''
        description: Proxy base URL for proxy mode
      model:
        type: string
        default: ''
        description: Model id; empty uses tier-2-agentic-pro in proxy mode (tier-2-agentic when the proxy does not list it), claude-sonnet-5-5
          otherwise
      runs_on:
        type: string
        default: ubuntu-latest
      max_successful_fixes:
        type: string
        default: '1'
        description: Max [autofix] commits per PR before skip (default 1)
      trusted_agent_bots:
        type: string
        default: ''
        description: Comma-separated agent bot logins (e.g. devin-ai-integration[bot]) whose pushes may trigger Autofix on CI failure. Off by
          default; * is not honoured.
    secrets:
      ANTHROPIC_API_KEY:
        required: false
        description: Required when provider_mode=anthropic.
      LITELLM_MASTER_KEY:
        required: false
        description: Required when provider_mode=proxy.
      GH_PAT:
        required: false
        description: CI-triggering publication credential; absent permits local repair but holds publication.
    outputs:
      published_sha:
        description: Verified remote publication SHA; empty does not establish handling.
        value: ${{ jobs.autofix.outputs.published_sha }}
      publication:
        description: Controller outcome, separate from editor execution.
        value: ${{ jobs.autofix.outputs.publication }}
      activation:
        description: 'active (legacy execution-file signal; not proof of a tool action) | skipped (a gate declined this event: loop-break, fix
          cap, actor, stale or closed PR). Empty when the job did not run or failed before reaching the agent. Never inert: missing credentials
          and an agent that produced no execution fail the job.'
        value: ${{ jobs.autofix.outputs.activation }}
permissions:
  contents: read
  pull-requests: write
  issues: write
jobs:
  autofix:
    name: Autofix PR
    if: |-
      ((
        (
          github.event_name == 'pull_request_review' &&
          contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.review.author_association) &&
          github.actor != 'github-actions[bot]'
        ) ||
        (
          github.event_name == 'pull_request_review_comment' &&
          contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) &&
          github.actor != 'github-actions[bot]'
        ) ||
        (
          github.event_name == 'issue_comment' &&
          github.event.issue.pull_request &&
          (
            (
              contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) &&
              github.actor != 'github-actions[bot]'
            ) ||
            (
              github.actor_id == '41898282' &&
              startsWith(github.event.comment.body, '**[@')
            )
          )
        ) ||
        (
          github.event_name == 'workflow_run' &&
          github.event.workflow_run.conclusion == 'failure' &&
          github.event.workflow_run.event == 'pull_request' &&
          github.event.workflow_run.pull_requests[0] != null
        )
      ) &&
      github.actor != 'dependabot[bot]' &&
      github.actor != 'renovate[bot]') && github.event.action != 'edited' || (contains(fromJSON('["issue_comment","pull_request_review","pull_request_review_comment"]'), github.event_name) && github.event.sender.type == 'Bot' && contains(fromJSON(vars.AUTOFIX_TRUSTED_REVIEWER_IDS || '["199175422","136622811"]'), github.actor_id) && (github.event.comment.body || github.event.review.body || '') != '' && !contains((github.event.comment.body || github.event.review.body || ''), 'auto-generated reply by CodeRabbit') && ((contains((github.event.comment.body || github.event.review.body || ''), ' Badge') || contains((github.event.comment.body || github.event.review.body || ''), 'P0:') || contains((github.event.comment.body || github.event.review.body || ''), 'P1:') || contains((github.event.comment.body || github.event.review.body || ''), 'P2:') || contains((github.event.comment.body || github.event.review.body || ''), 'P3:') || contains((github.event.comment.body || github.event.review.body || ''), 'Critical**') || contains((github.event.comment.body || github.event.review.body || ''), 'Major**') || contains((github.event.comment.body || github.event.review.body || ''), 'Minor**') || contains((github.event.comment.body || github.event.review.body || ''), 'Nitpick**') || contains((github.event.comment.body || github.event.review.body || ''), 'Critical:') || contains((github.event.comment.body || github.event.review.body || ''), 'Major:') || contains((github.event.comment.body || github.event.review.body || ''), 'Minor:') || contains((github.event.comment.body || github.event.review.body || ''), 'Nitpick:') || contains((github.event.comment.body || github.event.review.body || ''), 'Potential issue') || contains((github.event.comment.body || github.event.review.body || ''), 'Actionable comments posted: 1') || contains((github.event.comment.body || github.event.review.body || ''), 'Actionable comments posted: 2') || contains((github.event.comment.body || github.event.review.body || ''), 'Actionable comments posted: 3') || contains((github.event.comment.body || github.event.review.body || ''), 'Actionable comments posted: 4')) || !(contains((github.event.comment.body || github.event.review.body || ''), 'codex-pull-request-review-summary') || contains((github.event.comment.body || github.event.review.body || ''), 'no security issues were found') || contains((github.event.comment.body || github.event.review.body || ''), 'Codex Review: Didn''t find any major issues.') || contains((github.event.comment.body || github.event.review.body || ''), 'Actionable comments posted: 0') || contains((github.event.comment.body || github.event.review.body || ''), 'rate limited by coderabbit.ai') || contains((github.event.comment.body || github.event.review.body || ''), 'skip review by coderabbit.ai') || contains((github.event.comment.body || github.event.review.body || ''), 'usage limit') || contains((github.event.comment.body || github.event.review.body || ''), 'BUGBOT_FREE_TIER_DISABLED_UPSELL'))))
    uses: $/.github/workflows/pr-autofix-execution-reusable.yml
    with:
      variant: reusable
      provider_mode: ${{ inputs.provider_mode }}
      litellm_proxy_url: ${{ inputs.litellm_proxy_url }}
      model: ${{ inputs.model }}
      runs_on: ${{ inputs.runs_on }}
      max_successful_fixes: ${{ inputs.max_successful_fixes }}
      trusted_agent_bots: ${{ inputs.trusted_agent_bots }}
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      LITELLM_MASTER_KEY: ${{ secrets.LITELLM_MASTER_KEY }}
      GH_PAT: ${{ secrets.GH_PAT }}
